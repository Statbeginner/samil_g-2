    Q132: { h: '다른 본부에서는 자주 쓰는데 저희 본부에선 잘 모르는 용어가 있는지 궁금해요.' },
    Q153: { h: '요청드릴 자료가 있어 연락드렸어요. 필요한 이유와 회신 부탁드리는 날짜를 함께 적어 두었습니다.' },
    Q154: { h: '요청드린 자료 잘 받았습니다. 바쁘신 중에 챙겨주셔서 감사합니다.', say: true },
    Q155: { h: '이번에 함께 일하게 되어 인사드리러 왔어요. 제가 맡은 업무를 간단히 말씀드릴게요.', say: true },
    Q156: { h: '이번 주 중에 점심이나 커피 한번 함께하시면 좋겠어요.', inv: true },
    Q157: { h: '오늘 진행 상황과 내일 할 일을 세 줄로 정리해 보고드려요.', say: true },
    Q158: { h: '주신 리뷰 노트 반영했어요. 고친 부분을 한 줄로 정리해 두었습니다.', say: true },
    Q159: { h: '막힌 부분이 있어서, 제가 확인한 것과 아직 모르는 것을 나눠 정리해 왔어요. 잠깐 봐주실 수 있을까요?' },
    Q160: { h: '오늘 늦게까지 고생 많으세요. 음료 하나 드리고 싶어서요.', c: '오늘 늦게까지 고생 많아. 음료 하나 사 왔어!', say: true },
    Q161: { h: '자료 전달드려요. 봐주셨으면 하는 부분을 맨 위에 한 줄로 정리해 두었습니다.', say: true },
    Q162: { h: '각자 쓴 자료 요청 메일을 바꿔 읽어보면 좋을 것 같아서요.', c: '각자 쓴 자료 요청 메일 서로 바꿔 읽어볼래?', inv: true },
  };
  const hasBatchim = (word) => { const c = String(word).trim().slice(-1).charCodeAt(0); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 > 0; };
  function localOpeners(s, q, o) {
    const p = s.profile;
    const line = OPENER_LINES[q.id] || { h: `${q.ask || '이야기 나눠보고 싶어서'} 연락드렸어요.` };
    const pick = (arr) => arr[(o.n || 0) % arr.length];
    const join = (...xs) => xs.filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();
    const call = q.stage === 5 ? '담당자님' : o.rank === 'manager' ? '매니저님' : o.rank === 'senior' ? '선배님' : '';
    const hi = call ? `안녕하세요, ${call}!` : '안녕하세요!';
    const me = `${p.team} ${p.nickname}`;
    const msg = o.channel === 'messenger';
    const long = q.minutes > 10;
    const casual = o.known && o.rank === 'associate' && q.stage === 1;   // 아는 동기에게는 반말
    const asks = (t) => /\?$/.test(t);

    const politeClose = line.say ? pick(['앞으로도 많이 배우겠습니다!', '앞으로도 잘 부탁드립니다!'])
      : line.inv ? pick(['편하신 날 알려주시면 맞춰보겠습니다.', '시간 괜찮으신 날 말씀 주시면 일정 맞춰볼게요.'])
      : !msg ? pick(['지금 잠깐 괜찮으실까요? 바쁘시면 다음에 다시 찾아뵐게요.', '잠깐 시간 괜찮으세요? 바쁘시면 편하실 때 다시 올게요.'])
      : long ? pick(['편하실 때 10분 정도 시간 내주실 수 있을까요? 바쁘시면 편하게 말씀 주셔도 괜찮습니다.', '혹시 이번 주 중에 잠깐 시간 괜찮으실까요? 어려우시면 편하게 말씀 주세요.'])
      : pick(['편하실 때 답장 주시면 감사하겠습니다.', '시간 나실 때 편하게 답 주세요.']);
    const polite = join(hi, o.known ? '' : `저는 ${divisionOf(p.division)?.label || ''} ${me}입니다.`, line.h, politeClose);

    let friendly, short;
    if (casual) {
      const c = line.c || line.h;
      const close = line.say ? '😊' : asks(c) ? pick(['😊', 'ㅎㅎ']) : msg ? pick(['시간 될 때 커피 한잔할래? ☕', '점심 먹고 잠깐 얘기할래? 😊']) : pick(['지금 잠깐 괜찮아? 😊', '잠깐 시간 돼? 😊']);
      friendly = join(pick(['안녕!', '잘 지내?']), c, close);
      short = join(c, line.say || asks(c) ? '' : msg ? '시간 되면 알려줘!' : '잠깐 괜찮아?');
    } else {
      const greet = o.known ? (call ? `${call}, 안녕하세요!` : pick(['안녕하세요!', '잘 지내셨어요?'])) : `${hi} ${me}${hasBatchim(p.nickname) ? '이에요' : '예요'}.`;
      const close = line.say ? '앞으로도 잘 부탁드려요! 🙏'
        : line.inv ? pick(['편하신 날 알려주세요! 😊', '시간 괜찮으실 때 말씀 주세요! 😊'])
        : !msg ? pick(['혹시 지금 잠깐 괜찮으세요? 😊', '잠깐 이야기 나눌 수 있을까요? 😊'])
        : long ? pick(['시간 괜찮으실 때 커피 한잔 어떠세요? ☕', '편하실 때 점심이나 커피 한번 같이 해요! 😊'])
        : pick(['편하실 때 답 주세요! 😊', '시간 나실 때 알려주세요! 😊']);
      friendly = join(greet, line.h, close);
      short = join(hi, o.known ? '' : `${me}입니다.`, line.h,
        line.say || asks(line.h) ? '' : line.inv ? '어떠세요?' : msg ? '편하실 때 답 주세요!' : '잠깐 괜찮으세요?');
    }
    return { polite, friendly, short };
  }

  // 옛 관심사(v7 이전)를 엑셀 카테고리 이름으로 변환
  function toCategoryInterests(list) {
    const out = new Set();
    (list || []).forEach((l) => {
      const c = INTEREST_MAP[l]?.[0] || LEGACY_INTEREST_MAP[l] || KEYWORD_CATS.find(([re]) => re.test(l))?.[1];
      if (c) out.add(CATEGORIES[c].label);
    });
    return out.size ? [...out] : [CATEGORIES.smalltalk.label];
  }

  function localWeeklyComment(sum) {
    if (sum.quests === 0) return { comment: '이번 주는 바빴죠? 쉬어가는 것도 괜찮아요.', next: '다음 주엔 ⚡ 빠른 퀘스트 하나로 가볍게 다시 시작해봐요.' };
    const work = Object.entries(sum.byCat).filter(([c]) => CATEGORIES[c].work).reduce((a, [, n]) => a + n, 0);
    if (work / sum.quests >= 0.5) return { comment: '이번 주는 업무 퀘스트가 많았네요.', next: '다음 주엔 다른 본부 사람을 만나보는 건 어때요?' };
    if (sum.people < sum.quests / 2) return { comment: '혼자서도 꾸준히 해낸 한 주였어요.', next: '다음 주엔 👥 함께하는 퀘스트를 하나 더 도전해봐요.' };
    return {
      comment: `${sum.people}번이나 사람들과 교류한 활발한 한 주였어요!`,
      next: sum.least ? `다음 주엔 '${CATEGORIES[sum.least].label}' 퀘스트도 한 번 시도해볼까요?` : '다음 주엔 처음 만나는 사람과 하는 퀘스트에 도전해봐요.',
    };
  }

  /* =========================================================
   * 14. XP · 레벨 · 스트릭
   * ========================================================= */
  const Progress = {
    goal(s) { const g = s.profile.dailyGoalXP || DEFAULT_DAILY_GOAL; return s.settings.busySeason ? Math.max(5, Math.round(g / 2)) : g; },
    todayXP(s) { return s.stats.dailyXP[Clock.today()] || 0; },
    snapshot(s) {
      return { total: s.stats.totalXP, level: levelOf(s.stats.totalXP), today: this.todayXP(s), goal: this.goal(s), streak: s.stats.streak, gems: s.stats.gems };
    },
    award(s, xp, { gems = 0, active = true } = {}) {
      const t = Clock.today();
      s.stats.totalXP += xp;
      s.stats.dailyXP[t] = (s.stats.dailyXP[t] || 0) + xp;
      s.stats.level = levelOf(s.stats.totalXP);
      s.stats.gems += gems;
      if (active) this.markActive(s);
    },
    markActive(s) {
      const t = Clock.today(), last = s.stats.lastActiveDate;
      if (last === t) return;
      if (last && (diffDays(t, last) === 1 || s.settings.busySeason)) s.stats.streak += 1;
      else s.stats.streak = 1;
      s.stats.bestStreak = Math.max(s.stats.bestStreak || 0, s.stats.streak);
      s.stats.lastActiveDate = t;
    },
    // 하루 이상 비면 0으로 (Busy Season 모드는 유지)
    checkStreak(s) {
      const last = s.stats.lastActiveDate;
      if (!last || s.settings.busySeason || s.stats.streak === 0) return false;
      if (diffDays(Clock.today(), last) > 1) { s.stats.streak = 0; s.meta.streakBrokeOn = Clock.today(); return true; }
      return false;
    },
    completeStep(s, item, i) {
      const step = item.steps[i];
      if (!step || step.done) return null;
      const before = this.snapshot(s);
      step.done = true; step.doneAt = nowISO();
      if (item.status === 'todo') { item.status = 'doing'; item.startedAt = nowISO(); }
      this.award(s, STEP_XP);
      s.questHistory.push({ kind: 'step', uid: item.uid, questId: item.questId, category: QMAP[item.questId].cat, date: Clock.today(), completedAt: nowISO(), xp: STEP_XP, step: i });
      return { before, after: this.snapshot(s), doneCount: item.steps.filter((x) => x.done).length };
    },
    completeQuest(s, item) {
      const q = QMAP[item.questId];
      const before = this.snapshot(s);
      this.award(s, q.xp, { gems: q.gems });
      item.status = 'done'; item.completedAt = nowISO();
      s.questHistory.push({
        kind: 'quest', uid: item.uid, questId: q.id, title: q.title, category: q.cat, stage: q.stage, together: q.together,
        xp: q.xp, date: Clock.today(), completedAt: nowISO(),
      });
      const after = this.snapshot(s);
      const newBadges = Badges.check(s);
      return { q, before, after, gems: q.gems, newBadges };
    },
  };

  /* =========================================================
   * 16. 주간 리포트 계산
   * ========================================================= */
  function weekSummary(s, wk) {
    const end = addDays(wk, 6);
    const qs = s.questHistory.filter((h) => h.kind === 'quest' && h.date >= wk && h.date <= end);
    let xp = 0;
    for (let d = wk; d <= end; d = addDays(d, 1)) xp += s.stats.dailyXP[d] || 0;
    const byCat = {};
    qs.forEach((h) => { byCat[h.category] = (byCat[h.category] || 0) + 1; });
    const sorted = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
    const interestCats = Object.keys(Engine.interestCats(s));
    const pool = [...new Set([...interestCats, ...Object.keys(byCat)])];
    const least = pool.length ? pool.sort((a, b) => (byCat[a] || 0) - (byCat[b] || 0))[0] : null;
    return { wk, end, quests: qs.length, xp, people: qs.filter((h) => h.together).length, byCat, most: sorted[0]?.[0] || null, least };
  }

  /* =========================================================
   * 16-2. 배지 (카테고리 11종 + 첫 발걸음)
   *       카테고리 배지 = 그 카테고리의 👥함께하는 퀘스트를 동기·팀 동료·선배·타본부 네 대상 모두와 완료
   *       altName: 기획 검토용 대안 이름 (name과 바꾸면 바로 반영)
   * ========================================================= */
  const CATEGORY_BADGES = {
    career:    { name: '진로 나침반',       altName: '커리어 지도 제작자', message: '네 방향에서 커리어 이야기를 들었어요' },
    food:      { name: '점심 탐험가',       altName: '맛집 지도 제작자',   message: '회사 주변 지도가 네 사람 덕에 넓어졌어요' },
    study:     { name: '이슈 스캐너',       altName: '개정안 헌터',        message: '회계·AI·세법 이슈를 함께 파고들었어요' },
    hobby:     { name: '퇴근 후 크루',      altName: '동호회 개척자',      message: '일 밖에서도 함께할 사람이 생겼어요' },
    feedback:  { name: '피드백 수집가',     altName: '리뷰 반영 장인',     message: '네 시선의 피드백을 모두 받아 봤어요' },
    health:    { name: '비지 시즌 생존자',  altName: '번아웃 방어막',      message: '바쁜 시즌을 버틸 루틴을 모았어요' },
    smalltalk: { name: '아이스 브레이커',   altName: '엘리베이터 토커',    message: '먼저 말 거는 사람이 되었어요' },
    event:     { name: '행사장 단골',       altName: '타운홀 개근러',      message: '행사마다 아는 얼굴이 생겼어요' },
    growth:    { name: '1% 성장러',         altName: '레벨업 러너',        message: '네 사람에게서 하나씩 배웠어요' },
    terms:     { name: '걸어 다니는 용어집', altName: '약어 해독가',        message: '이제 회의 중 약어가 두렵지 않아요' },
    relation:  { name: '신뢰 쌓는 사람',    altName: '현장 매너왕',        message: '클라이언트부터 선배까지, 일하는 관계를 넓혔어요' },
  };
  const BADGES = [
    { id: 'first_step', kind: 'first', name: '첫 발걸음', emoji: '👣', color: '#F26B1D', message: '첫 퀘스트를 완료했어요. 모든 탐험은 한 걸음부터!', rule: '퀘스트 1개를 완료하면 받아요' },
    ...Object.entries(CATEGORY_BADGES).map(([cat, b]) => ({
      id: `cat_${cat}`, kind: 'category', cat, name: b.name, altName: b.altName, message: b.message,
      emoji: CATEGORIES[cat].emoji, color: CATEGORIES[cat].color,
      rule: `${CATEGORIES[cat].label} 카테고리 미션을 4개 완료하면 받아요`,
    })),
  ];
  const BADGE_MAP = Object.fromEntries(BADGES.map((b) => [b.id, b]));
  const Badges = {
    earnedIds(s) { return new Set((Array.isArray(s.badges?.earned) ? s.badges.earned : []).map((e) => e.id)); },
    // 대표 배지: 프로필·홈에 거는 배지 하나 (얻은 배지만)
    featured(s) { const id = s.badges?.featured; return id && this.earnedIds(s).has(id) ? BADGE_MAP[id] : null; },
    setFeatured(s, id) { s.badges.featured = id || null; },
    // 카테고리별로 완료한 서로 다른 미션 (먼저 완료한 순서로 최대 4칸) { 1: {id, title} | null, ... }
    stages(s, cat) {
      const out = { 1: null, 2: null, 3: null, 4: null };
      const seen = new Set();
      s.questHistory.forEach((h) => {
        if (h.kind !== 'quest' || h.category !== cat || seen.has(h.questId) || seen.size >= 4) return;
        seen.add(h.questId);
        out[seen.size] = { id: h.questId, title: h.title || QMAP[h.questId]?.title || '' };
      });
      return out;
    },
    progress(s, b) {
      if (b.kind === 'first') { const n = Math.min(1, doneQuestCount(s)); return { done: n, total: 1 }; }
      const st = this.stages(s, b.cat);
      return { done: Object.values(st).filter(Boolean).length, total: 4, stages: st, ids: Object.values(st).filter(Boolean).map((x) => x.id) };
    },
    // 새로 획득한 배지를 기록하고 목록으로 반환
    check(s) {
      if (!s.badges || !Array.isArray(s.badges.earned)) s.badges = { ...(s.badges || {}), earned: [] };
      const have = this.earnedIds(s), fresh = [];
      BADGES.forEach((b) => {
        if (have.has(b.id)) return;
        const p = this.progress(s, b);
        if (p.done >= p.total) { s.badges.earned.push({ id: b.id, earnedAt: nowISO(), date: Clock.today() }); fresh.push(b); }
      });
      return fresh;
    },
  };

  /* =========================================================
   * 4. 저장소 (localStorage 실패해도 메모리로 계속 동작)
   * ========================================================= */
  const Store = {
    memory: null,
    persistent: true,
    load() {
      let raw = null;
      try { raw = localStorage.getItem(STORAGE_KEY); }
      catch (e) { this.persistent = false; console.warn('[AQ] 저장소 읽기 실패', e); return this.memory; }
      if (!raw) return this.memory;
      try { return migrate(JSON.parse(raw)); }
      catch (e) { console.warn('[AQ] 저장 데이터 형식 오류, 초기화합니다', e); return null; }
    },
    save(state) {
      this.memory = state;
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); this.persistent = true; return true; }
      catch (e) {
        this.persistent = false;
        console.warn('[AQ] 저장 실패', e);
        toast('브라우저에 저장하지 못했어요. 이번 접속 동안만 유지돼요.');
        return false;
      }
    },
    clear() {
      this.memory = null;
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) { console.warn('[AQ] 삭제 실패', e); }
    },
  };

  /* 앱 전체 상태 (v5). roadmap은 다음 단계에서 채운다. */
  function createInitialState(profile) {
    const t = nowISO();
    return {
      version: SCHEMA_VERSION,
      profile,
      interestHistory: [{ date: Clock.today(), interests: [...(profile.interests || [])] }],
      stats: { totalXP: 0, level: 1, streak: 0, bestStreak: 0, lastActiveDate: null, gems: START_GEMS, dailyXP: {} },
      dailyQuests: { date: null, items: [], added: 0 },
      questHistory: [],   // { kind: 'quest' | 'step', questId, title, category, xp, date, note, partnerDivision, ... }
      swapHistory: [],    // { date, fromId, toId, category, reason }
      weeklyReports: {},  // { 'YYYY-MM-DD(월요일)': { quests, xp, people, newDivisions, byCat, comment } }
      badges: { earned: [] },                         // [{ id, earnedAt, date }]
      roadmap: { milestones: [] },                    // 다음 단계: 로드맵
      settings: { busySeason: false, theme: 'system' },
      meta: { createdAt: t, updatedAt: t, onboardingCompletedAt: t, dayOffset: 0, reportAutoWeek: null, streakBrokeOn: null, demoMode: false },
    };
  }

  // 이전 버전 데이터 → v4. 누락된 항목은 기본값으로 채우고, 삭제된 기능(협동·파트너)의 데이터는 버린다.
  function migrate(data) {
    if (!data || typeof data !== 'object' || !data.profile || !data.profile.nickname) return null;
    const profile = normalizeProfile(data.profile);
    profile.interests = toCategoryInterests([...profile.interests, ...(profile.customInterests || [])]);
    profile.customInterests = [];
    const base = createInitialState(profile);
    const obj = (v) => (v && typeof v === 'object' && !Array.isArray(v) ? v : {});
    const arr = (v) => (Array.isArray(v) ? v : []);
    const stats = { ...base.stats, ...obj(data.stats) };
    if (!data.stats && data.progress) {
      const p = obj(data.progress), st = obj(p.streak);
      Object.assign(stats, { totalXP: p.totalXP || 0, streak: st.current || 0, bestStreak: st.best || 0, lastActiveDate: st.lastActiveDate || null, dailyXP: obj(p.dailyXP) });
    }
    stats.dailyXP = obj(stats.dailyXP);
    stats.totalXP = Number(stats.totalXP) || 0;
    stats.gems = Number.isFinite(stats.gems) ? stats.gems : START_GEMS;
    stats.level = levelOf(stats.totalXP);
    const dq = { ...base.dailyQuests, ...obj(data.dailyQuests) };
    const before = arr(dq.items).length;
    dq.items = arr(dq.items).filter((i) => i && QMAP[i.questId]);
    if (dq.items.length !== before || !dq.items.length) { dq.date = null; dq.items = []; dq.added = 0; }  // 미션 목록이 바뀌면 오늘의 퀘스트를 새로 뽑음
    const out = {
      ...base,
      version: SCHEMA_VERSION,
      profile,
      interestHistory: arr(data.interestHistory).length ? data.interestHistory : base.interestHistory,
      stats,
      dailyQuests: dq,
      questHistory: arr(data.questHistory),
      swapHistory: arr(data.swapHistory),
      weeklyReports: obj(data.weeklyReports),
      badges: { ...base.badges, ...obj(data.badges) },
      roadmap: { ...base.roadmap, ...obj(data.roadmap) },
      settings: { busySeason: !!obj(data.settings).busySeason, theme: obj(data.settings).theme || 'system' },  // 알려진 설정만 읽음
      meta: { ...base.meta, ...obj(data.meta) },
    };
    return out;
  }

  function emptyProfile() {
    return {
      nickname: '', division: '', team: '', joinMonth: '',
      interests: [], customInterests: [],
      networkingStyle: '', dailyGoalXP: DEFAULT_DAILY_GOAL,
      createdAt: '', updatedAt: '',
    };
  }
  function normalizeProfile(p = {}) {
    const out = { ...emptyProfile(), ...p };
    out.nickname = String(out.nickname).trim();
    out.team = String(out.team).trim();
    out.interests = [...new Set(Array.isArray(out.interests) ? out.interests : [])];
    out.customInterests = [...new Set(Array.isArray(out.customInterests) ? out.customInterests : [])];
    if (!goalOf(out.dailyGoalXP)) out.dailyGoalXP = DEFAULT_DAILY_GOAL;
    return out;
  }

  /* =========================================================
   * 5. 앱 컨트롤러 / 화면 전환
   * ========================================================= */
  const App = {
    state: null,
    screens: ['onboarding', 'celebrate', 'main'],
    show(name) {
      this.screens.forEach((s) => { $(`#screen-${s}`).hidden = s !== name; });
    },
    setState(next) {
      next.meta = { ...next.meta, updatedAt: nowISO() };
      this.state = next;
      return Store.save(next);
    },
    commit() { return this.state ? this.setState(this.state) : false; },
    saveProfile(draft) {
      const prev = this.state;
      const t = nowISO();
      const profile = normalizeProfile({ ...draft, createdAt: prev?.profile?.createdAt || t, updatedAt: t });
      const next = prev ? { ...prev, profile } : createInitialState(profile);
      if (prev) {
        const before = JSON.stringify([...prev.profile.interests].sort()), after = JSON.stringify([...profile.interests].sort());
        if (before !== after) next.interestHistory = [...(prev.interestHistory || []), { date: Clock.today(), interests: [...profile.interests] }];
      }
      return this.setState(next);
    },
    init() {
      Onboarding.init();
      Celebrate.init();
      this.state = Store.load();
      if (this.state) { Clock.offset = this.state.meta.dayOffset || 0; Store.save(this.state); Main.enter('home'); }
      else Onboarding.start();
    },
  };

  /* =========================================================
   * 6. 온보딩 단계 정의
   *    각 단계 = { id, bubble(draft), render(body, draft, ctx), valid(draft), cta, ... }
   *    프로필 수정 화면에서도 Onboarding.start({ profile, step })로 재사용 가능
   * ========================================================= */
  const validateNickname = (v) => {
    const t = v.trim();
    if (!t) return v.length ? '공백만으로는 닉네임을 만들 수 없어요.' : '닉네임을 입력해주세요.';
    if (charLen(t) < 2) return '닉네임은 2자 이상 입력해주세요.';
    if (charLen(t) > 10) return '닉네임은 10자 이하로 입력해주세요.';
    return '';
  };
  const validateTeam = (v) => {
    const t = v.trim();
    if (!t) return v.length ? '공백만으로는 입력할 수 없어요.' : '소속 팀을 입력해주세요.';
    if (charLen(t) > 20) return '팀 이름은 20자 이하로 입력해주세요.';
    return '';
  };

  // 텍스트 입력 단계 공통 렌더러
  function renderTextField(body, d, ctx, { key, id, label, validate, max, placeholder, hint, autocomplete = 'off' }) {
    body.innerHTML = `
      <div class="field">
        <label class="sr-only" for="${id}">${label}</label>
        <input id="${id}" class="text-input" type="text" autocomplete="${autocomplete}" enterkeyhint="next"
               placeholder="${esc(placeholder)}" value="${esc(d[key])}" aria-describedby="${id}-err">
        <div class="field-meta">
          <p class="field-error" id="${id}-err" role="alert"></p>
          <span class="counter" id="${id}-cnt"></span>
        </div>
      </div>
      ${hint ? `<p class="hint">${icon('info', 18)}<span>${hint}</span></p>` : ''}`;
    const input = $(`#${id}`, body), err = $(`#${id}-err`, body), cnt = $(`#${id}-cnt`, body);
    const sync = (showError) => {
      const msg = validate(input.value);
      cnt.textContent = `${charLen(input.value.trim())}/${max}`;
      if (showError) { err.textContent = msg; input.classList.toggle('is-invalid', !!msg); }
      return !msg;
    };
    input.addEventListener('input', () => { d[key] = input.value; sync(true); ctx.refresh(); });
    input.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' || isImeEnter(e)) return;
      e.preventDefault();
      if (sync(true)) ctx.next();
    });
    sync(false);
    ctx.showErrors = () => sync(true);
  }

  const STEP = { WELCOME: 0, NICKNAME: 1, DIVISION: 2, TEAM: 3, JOIN: 4, INTERESTS: 5, STYLE: 6, GOAL: 7, CONFIRM: 8 };
  const PROGRESS_STEPS = 8;
  const nick = (d) => esc(d.nickname.trim() || '신입');

  const STEPS = [
    /* 0. 웰컴 */
    {
      id: 'welcome', cta: '시작하기', layout: 'welcome',
      head: () => `
        <p class="bubble down">안녕하세요! 저는 삼일이에요.<br>회사 생활을 함께 탐험해볼까요?</p>
        <div class="mascot-wrap xl wave">${mascotSVG()}</div>
        <h1 class="wordmark">Associate <span>Quest</span></h1>
        <p class="lede">매일 작은 퀘스트로 새로운 동료와 경험을 만나보세요</p>`,
      render() {},
      valid: () => true,
    },
    /* 1. 닉네임 */
    {
      id: 'nickname', bubble: () => '먼저, 뭐라고 불러드리면 될까요?', focus: '#in-nickname',
      render: (body, d, ctx) => renderTextField(body, d, ctx, {
        key: 'nickname', id: 'in-nickname', label: '닉네임', validate: validateNickname, max: 10,
        placeholder: '2~10자로 입력해주세요', autocomplete: 'nickname',
        hint: '동료에게 보이는 이름이에요. 실명이 아니어도 괜찮아요.',
      }),
      valid: (d) => !validateNickname(d.nickname),
    },
    /* 2. 소속 본부 */
    {
      id: 'division', bubble: (d) => `${nick(d)}님은 어느 본부에서 일하고 있나요?`,
      render(body, d, ctx) {
        body.innerHTML = `<div class="choice-list" role="radiogroup" aria-label="소속 본부">
          ${DIVISIONS.map((v) => `
            <button type="button" class="choice" role="radio" data-id="${v.id}" aria-checked="${d.division === v.id}">
              <span class="choice-icon">${icon(v.icon)}</span>
              <span class="choice-text"><span class="choice-title">${v.label}</span><span class="choice-desc">${v.desc}</span></span>
            </button>`).join('')}
        </div>`;
        radioGroup(body, (id) => { d.division = id; ctx.refresh(); });
      },
      valid: (d) => !!divisionOf(d.division),
    },
    /* 3. 소속 팀 */
    {
      id: 'team', bubble: (d) => `${nick(d)}님, 소속 팀도 알려주세요!`, focus: '#in-team',
      render: (body, d, ctx) => renderTextField(body, d, ctx, {
        key: 'team', id: 'in-team', label: '소속 팀', validate: validateTeam, max: 20,
        placeholder: `예: ${(divisionOf(d.division) || DIVISIONS[0]).teamExample}`, autocomplete: 'organization-title',
        hint: '첫마디 도우미의 자기소개 문장에 들어가요',
      }),
      valid: (d) => !validateTeam(d.team),
    },
    /* 4. 입사 월 */
    {
      id: 'join', bubble: (d) => `${nick(d)}님은 언제 입사하셨나요?`,
      render(body, d, ctx) {
        const now = new Date();
        const allowed = new Set(recentMonths(now));
        const years = [...new Set([...allowed].map((k) => Number(k.slice(0, 4))))].sort((a, b) => a - b);
        if (!ctx.ui.joinYear || !years.includes(ctx.ui.joinYear)) ctx.ui.joinYear = d.joinMonth ? Number(d.joinMonth.slice(0, 4)) : now.getFullYear();
        body.innerHTML = `
          <div class="seg-group" role="radiogroup" aria-label="입사 연도" id="join-years"></div>
          <div class="months" role="radiogroup" aria-label="입사 월" id="join-months"></div>
          <div id="join-result" aria-live="polite"></div>
          <p class="hint">${icon('info', 18)}<span>최근 24개월 안에서 고를 수 있어요</span></p>`;
        const draw = () => {
          $('#join-years', body).innerHTML = years.map((y) =>
            `<button type="button" class="seg" role="radio" data-year="${y}" aria-checked="${ctx.ui.joinYear === y}">${y}년</button>`).join('');
          $('#join-months', body).innerHTML = Array.from({ length: 12 }, (_, i) => {
            const key = monthKey(ctx.ui.joinYear, i + 1);
            const ok = allowed.has(key);
            return `<button type="button" class="month" role="radio" data-key="${key}" aria-checked="${d.joinMonth === key}" ${ok ? '' : 'disabled'}>${i + 1}월</button>`;
          }).join('');
          const res = $('#join-result', body);
          if (!d.joinMonth) { res.innerHTML = ''; return; }
          const n = tenureMonth(d.joinMonth);
          res.innerHTML = n === 1
            ? `<div class="tenure celebrate">입사를 축하해요! 🎉<small>입사 1개월차 Associate</small></div>`
            : `<div class="tenure">입사 ${n}개월차 Associate<small>${formatJoinMonth(d.joinMonth)} 입사</small></div>`;
        };
        body.addEventListener('click', (e) => {
          const y = e.target.closest('[data-year]');
          const m = e.target.closest('[data-key]');
          if (y) { ctx.ui.joinYear = Number(y.dataset.year); draw(); }
          if (m && !m.disabled) { d.joinMonth = m.dataset.key; draw(); ctx.refresh(); }
        });
        draw();
      },
      valid: (d) => !!d.joinMonth && recentMonths().includes(d.joinMonth),
    },
    /* 5. 관심사 — 카테고리 11개 중에서만 선택 */
    {
      id: 'interests', bubble: () => '요즘 관심 있는 걸 모두 골라주세요',
      render(body, d, ctx) {
        d.interests = d.interests.filter((l) => INTEREST_LABELS.includes(l));
        d.customInterests = [];
        body.innerHTML = `
          <div class="tag-top"><p class="group-label">여러 개 고를 수 있어요</p><span class="count" id="tag-count" aria-live="polite"></span></div>
          <div id="tag-groups" class="pane-body"></div>
          <p class="hint">${icon('info', 18)}<span>고른 카테고리의 미션을 매일 추천해드려요. 나중에 프로필에서 언제든 바꿀 수 있어요</span></p>`;
        const groupsEl = $('#tag-groups', body), countEl = $('#tag-count', body);
        const draw = () => {
          groupsEl.innerHTML = INTEREST_GROUPS.map((g) => `
            <div class="tag-group" role="group" aria-label="${g.label} 관심사">
              <p class="group-label">${g.label}</p>
              <div class="tags">${g.items.map(([l, sub]) => `<button type="button" class="tag cat-tag" data-label="${esc(l)}" aria-pressed="${d.interests.includes(l)}">${esc(l)}${sub ? `<small>${esc(sub)}</small>` : ''}</button>`).join('')}</div>
            </div>`).join('');
          const n = d.interests.length;
          countEl.textContent = n ? `${n}개 선택됨` : '0개 선택';
          countEl.classList.toggle('on', n > 0);
        };
        groupsEl.addEventListener('click', (e) => {
          const t = e.target.closest('[data-label]');
          if (!t) return;
          const label = t.dataset.label;
          const i = d.interests.indexOf(label);
          if (i >= 0) d.interests.splice(i, 1); else d.interests.push(label);
          draw(); ctx.refresh();
        });
        draw();
      },
      valid: (d) => d.interests.some((l) => INTEREST_LABELS.includes(l)),
    },
    /* 6. 네트워킹 성향 */
    {
      id: 'style', bubble: () => '새로운 사람을 만날 때 어떤 방식이 편한가요?',
      render(body, d, ctx) {
        body.innerHTML = `<div class="choice-grid" role="radiogroup" aria-label="네트워킹 성향">
          ${NETWORKING_STYLES.map((s) => `
            <button type="button" class="choice tall" role="radio" data-id="${s.id}" aria-checked="${d.networkingStyle === s.id}">
              ${ILLUST[s.id]}
              <span class="choice-text"><span class="choice-title">${s.label}</span><span class="choice-desc">${s.desc}</span></span>
            </button>`).join('')}
        </div>
        <p class="hint">${icon('info', 18)}<span>성향에 맞춰 1:1로 이야기하는 퀘스트나 여럿이 함께 움직이는 퀘스트를 더 자주 추천해요</span></p>`;
        radioGroup(body, (id) => { d.networkingStyle = id; ctx.refresh(); });
      },
      valid: (d) => !!styleOf(d.networkingStyle),
    },
    /* 7. 하루 목표 */
    {
      id: 'goal', bubble: (d) => `${nick(d)}님, 하루에 얼마나 도전해볼까요?`,
      render(body, d, ctx) {
        body.innerHTML = `<div class="choice-list" role="radiogroup" aria-label="하루 목표">
          ${DAILY_GOALS.map((g) => `
            <button type="button" class="choice" role="radio" data-id="${g.xp}" aria-checked="${d.dailyGoalXP === g.xp}">
              <span class="choice-text">
                <span class="choice-title">${g.label}${g.recommended ? '<span class="mini-tag">추천</span>' : ''}</span>
                <span class="choice-desc">${g.desc}</span>
              </span>
              <span class="xp-pill">${g.xp} XP</span>
            </button>`).join('')}
        </div>
        <p class="hint">${icon('info', 18)}<span>바쁜 시즌에는 설정에서 목표를 낮출 수 있어요</span></p>`;
        radioGroup(body, (id) => { d.dailyGoalXP = Number(id); ctx.refresh(); });
      },
      valid: (d) => !!goalOf(d.dailyGoalXP),
    },
    /* 8. 확인 */
    {
      id: 'confirm', cta: '모험 시작하기', bubble: (d) => `${nick(d)}님, 이대로 시작할까요?`,
      render(body, d, ctx) {
        const rows = [
          ['닉네임', esc(d.nickname.trim()), STEP.NICKNAME],
          ['소속 본부', esc(divisionOf(d.division)?.label || '-'), STEP.DIVISION],
          ['소속 팀', esc(d.team.trim()), STEP.TEAM],
          ['입사 월', d.joinMonth ? `${formatJoinMonth(d.joinMonth)} · ${tenureMonth(d.joinMonth)}개월차` : '-', STEP.JOIN],
          ['관심사', esc(d.interests.join(', ')), STEP.INTERESTS],
          ['만남 방식', esc(styleOf(d.networkingStyle)?.label || '-'), STEP.STYLE],
          ['하루 목표', goalOf(d.dailyGoalXP) ? `${goalOf(d.dailyGoalXP).label} · ${d.dailyGoalXP} XP` : '-', STEP.GOAL],
        ];
        body.innerHTML = `<dl class="summary">
          ${rows.map(([k, v, step]) => `
            <div class="summary-row"><dt>${k}</dt><dd>${v}</dd>
              <button type="button" class="edit-btn" data-step="${step}" aria-label="${k} 수정">수정</button></div>`).join('')}
        </dl>`;
        body.addEventListener('click', (e) => {
          const b = e.target.closest('[data-step]');
          if (b) ctx.edit(Number(b.dataset.step));
        });
      },
      valid: () => true,
      onNext: () => Onboarding.finish(),
    },
  ];

  // 라디오처럼 동작하는 카드 묶음
  function radioGroup(root, onSelect) {
    root.addEventListener('click', (e) => {
      const btn = e.target.closest('[role="radio"][data-id]');
      if (!btn) return;
      btn.parentElement.querySelectorAll('[role="radio"]').forEach((b) => b.setAttribute('aria-checked', String(b === btn)));
      onSelect(btn.dataset.id);
    });
  }

  /* =========================================================
   * 7. 온보딩 컨트롤러
   * ========================================================= */
  const Onboarding = {
    el: {},
    step: 0,
    draft: emptyProfile(),
    returnTo: null,   // 확인 화면에서 "수정"으로 들어오면 STEP.CONFIRM
    mode: 'new',      // 'new' | 'edit'(설정 > 프로필 수정)
    ui: {},           // 단계 간 유지할 화면 상태(선택 중인 연도 등)
    ctx: null,
    busy: false,

    init() {
      this.el = {
        header: $('#ob-header'), back: $('#ob-back'), progress: $('#ob-progress'),
        fill: $('#ob-progress-fill'), count: $('#ob-count'), viewport: $('#ob-viewport'), cta: $('#ob-cta'),
      };
      this.el.back.addEventListener('click', () => this.back());
      this.el.cta.addEventListener('click', () => this.next());
    },

    /** 온보딩 시작. 프로필 수정에 재사용: start({ profile: App.state.profile, step: 5 }) */
    start({ profile = null, step = STEP.WELCOME, mode = 'new' } = {}) {
      this.draft = profile ? normalizeProfile(JSON.parse(JSON.stringify(profile))) : emptyProfile();
      this.mode = mode;
      this.returnTo = null;
      this.ui = {};
      App.show('onboarding');
      this.el.viewport.innerHTML = '';
      this.go(step, 0);
    },

    go(index, dir) {
      const def = STEPS[index];
      this.step = index;
      const pane = document.createElement('section');
      pane.className = 'pane' + (def.layout === 'welcome' ? ' welcome' : '');
      pane.dataset.step = def.id;
      pane.innerHTML = (def.head
        ? def.head(this.draft)
        : `<div class="talk">${mascot()}<p class="bubble">${def.bubble(this.draft)}</p></div>`) + '<div class="pane-body"></div>';

      this.ctx = {
        ui: this.ui,
        refresh: () => this.refresh(),
        next: () => this.next(),
        edit: (s) => { this.returnTo = STEP.CONFIRM; this.go(s, -1); },
        showErrors: null,
      };
      def.render($('.pane-body', pane), this.draft, this.ctx);

      // 슬라이드 전환
      const old = this.el.viewport.querySelector('.pane.current');
      const animate = dir !== 0 && !reducedMotion();
      if (old) { old.classList.remove('current'); old.inert = true; old.setAttribute('aria-hidden', 'true'); }
      if (animate) pane.classList.add(dir > 0 ? 'from-right' : 'from-left');
      pane.classList.add('current');
      this.el.viewport.appendChild(pane);
      if (animate) {
        void pane.offsetWidth;
        pane.classList.remove('from-right', 'from-left');
        if (old) { old.classList.add(dir > 0 ? 'to-left' : 'to-right'); setTimeout(() => old.remove(), 380); }
        this.busy = true;
        setTimeout(() => { this.busy = false; }, 380);
      } else if (old) old.remove();

      // 마스코트 튀기
      const m = pane.querySelector('.mascot');
      if (m && dir !== 0) requestAnimationFrame(() => m.classList.add('hop'));

      // 상단/하단 영역
      const pct = Math.round((index / PROGRESS_STEPS) * 100);
      this.el.header.classList.toggle('is-hidden', index === STEP.WELCOME);
      this.el.fill.style.width = pct + '%';
      this.el.progress.setAttribute('aria-valuenow', String(pct));
      this.el.count.textContent = index === STEP.WELCOME ? '' : `${index}/${PROGRESS_STEPS}`;
      this.el.cta.textContent = this.mode === 'edit' && index === STEP.CONFIRM ? '저장하기' : (def.cta || '계속하기');
      this.refresh();

      if (def.focus) setTimeout(() => $(def.focus, pane)?.focus({ preventScroll: true }), animate ? 380 : 60);
      else if (dir !== 0) setTimeout(() => pane.focus?.({ preventScroll: true }), animate ? 380 : 0);
    },

    refresh() {
      this.el.cta.disabled = !STEPS[this.step].valid(this.draft);
    },

    next() {
      if (this.busy) return;
      const def = STEPS[this.step];
      if (!def.valid(this.draft)) { this.ctx?.showErrors?.(); return; }
      if (def.onNext) { def.onNext(); return; }
      if (this.returnTo !== null) { const t = this.returnTo; this.returnTo = null; this.go(t, 1); return; }
      this.go(this.step + 1, 1);
    },

    back() {
      if (this.busy || this.step === STEP.WELCOME) return;
      if (this.mode === 'edit' && this.step === STEP.CONFIRM && this.returnTo === null) { Main.enter('settings'); return; }
      if (this.returnTo !== null) { const t = this.returnTo; this.returnTo = null; this.go(t, -1); return; }
      this.go(this.step - 1, -1);
    },

    finish() {
      const bad = STEPS.findIndex((s) => !s.valid(this.draft));
      if (bad !== -1) { this.returnTo = STEP.CONFIRM; this.go(bad, -1); toast('아직 입력하지 않은 항목이 있어요.'); return; }
      App.saveProfile(this.draft);
      if (this.mode === 'edit') { Main.enter('settings'); toast('프로필을 저장했어요'); return; }
      Celebrate.show(App.state.profile);
    },
  };

  /* =========================================================
   * 8. 완료 축하 화면 (색종이)
   * ========================================================= */
  const AUTO_HOME_MS = 3000;
  const Celebrate = {
    timer: null, stopConfetti: null,
    init() { $('#celebrate-go').addEventListener('click', () => this.done()); },

  function runConfetti(canvas, duration = 2800) {
    const ctx = canvas.getContext('2d');
    if (!ctx) return () => {};
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = rect.width * dpr; canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const colors = ['#F26B1D', '#FFB020', '#1E5F74', '#72C4D8', '#FF8FA3', '#FFD7B8'];
    const W = rect.width, H = rect.height;
    const parts = Array.from({ length: 140 }, (_, i) => {
      const burst = i < 80;
      return {
        x: burst ? W / 2 + (Math.random() - .5) * 40 : Math.random() * W,
        y: burst ? H * .32 : -20 - Math.random() * H * .4,
        vx: burst ? (Math.random() - .5) * 11 : (Math.random() - .5) * 2,
        vy: burst ? -Math.random() * 11 - 3 : Math.random() * 2 + 1,
        g: .22 + Math.random() * .08, w: 6 + Math.random() * 6, h: 4 + Math.random() * 5,
        r: Math.random() * 6, vr: (Math.random() - .5) * .3, c: colors[i % colors.length],
      };
    });
    let start = null, raf = 0;
    const frame = (t) => {
      if (start === null) start = t;
      const el = t - start;
      ctx.clearRect(0, 0, W, H);
      const fade = Math.max(0, Math.min(1, (duration - el) / 600));
      for (const p of parts) {
        p.vy += p.g; p.vx *= .99; p.x += p.vx; p.y += Math.min(p.vy, 7); p.r += p.vr;
        ctx.save();
        ctx.globalAlpha = fade;
        ctx.translate(p.x, p.y); ctx.rotate(p.r);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 1.3)) + 1);
        ctx.restore();
      }
      if (el < duration) raf = requestAnimationFrame(frame); else ctx.clearRect(0, 0, W, H);
    };
    raf = requestAnimationFrame(frame);
    return () => { cancelAnimationFrame(raf); ctx.clearRect(0, 0, W, H); };
  }

  const BACK_ICON = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
  const CLOSE_ICON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  const Overlay = {
    stack: [],
    root() { return $('#overlay-root'); },
    push(el, kind = 'page') {
      el.classList.add('overlay', kind);
      this.root().appendChild(el);
      this.stack.push(el);
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
      setTimeout(() => el.querySelector('[data-autofocus], .page-head button, .sheet button, .btn')?.focus({ preventScroll: true }), 320);
      return el;
    },
    pop(el) {
      const target = el || this.stack[this.stack.length - 1];
      if (!target) return;
      this.stack = this.stack.filter((x) => x !== target);
      target.classList.remove('in');
      target.inert = true;
      setTimeout(() => target.remove(), 320);
      target.dispatchEvent(new CustomEvent('closed'));
    },
    clear() { [...this.stack].forEach((el) => el.remove()); this.stack = []; },
    top() { return this.stack[this.stack.length - 1]; },
  };
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;

      return Overlay.push(wrap, 'sheet-wrap');

  };

  function ringSVG(p, size = 40, stroke = 5, cls = '') {
    const r = (size - stroke) / 2, c = 2 * Math.PI * r;

    return `<svg class="ring ${cls}" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
      <circle class="track" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}"/>
      <circle class="bar" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke-width="${stroke}" stroke-linecap="round"
        stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" data-c="${c.toFixed(2)}"/>
    </svg>`;
  }
  const setRing = (svg, p) => { const bar = svg?.querySelector('.bar'); if (bar) bar.style.strokeDashoffset = String(Number(bar.dataset.c) * (1 - Math.max(0, Math.min(1, p)))); };

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }

        ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        const ok = document.execCommand('copy');
        ta.remove();
        return ok;

    }

    text(s) {

      const nick = s.profile.nickname, streak = s.stats.streak;
      if (Progress.todayXP(s) >= Progress.goal(s)) return `오늘 목표 달성! 대단해요 ${nick}님${streak >= 2 ? ` 🔥 ${streak}일째 이어가는 중!` : ''}`;
      const weekday = d >= 1 && d <= 5;
      let msg;
      if (d === 1 && h >= 5 && h < 12) msg = '한 주 시작! 가볍게 하나 해볼까요?';
      else if (weekday && h >= 11 && h < 13) msg = '점심시간에 할 수 있는 퀘스트가 있어요';
      else if (d === 5 && h >= 15) msg = '이번 주 마무리 퀘스트 어때요?';
      else if (!weekday) msg = `주말엔 푹 쉬어요, ${nick}님. 가볍게 볼 퀘스트만 골라뒀어요`;
      else if (h >= 5 && h < 11) msg = `좋은 아침이에요, ${nick}님! 오늘도 작은 한 걸음부터`;
      else if (h >= 13 && h < 18) msg = '오후엔 ⚡ 빠른 퀘스트 하나 어때요?';
      else if (h >= 18 && h < 23) msg = `오늘도 고생했어요, ${nick}님. 5분짜리 하나만 해볼까요?`;
      else msg = '늦은 시간이에요. 내일 퀘스트를 미리 둘러볼까요?';

  // 다음 칭호까지: [레벨, 칭호]는 TITLES에서 지금 레벨보다 높은 것 중 가장 가까운 것
  function nextTitleHTML(level, xp) {

        ${enough ? '' : `<p class="field-error">💎이 부족해요. 퀘스트를 완료하면 난이도에 따라 💎 ${DIFFICULTY.easy.gems}~${DIFFICULTY.hard.gems}개를 받아요.</p>`}
        <button type="button" class="btn btn-primary" id="swap-go" disabled>💎 ${SWAP_COST}개 사용해서 바꾸기</button>

      });
      $('#swap-go', wrap).addEventListener('click', () => {
        if (!reason || App.state.stats.gems < SWAP_COST) return;
        const st = App.state;
        const text = reason === 'other' ? note.value.trim().slice(0, SWAP_NOTE_MAX) : '';
        st.swapHistory.push({ date: Clock.today(), at: nowISO(), fromId: q.id, category: q.cat, reason, ...(text ? { note: text } : {}), toId: null });
        const nq = Engine.replacement(st, it, reason);
        st.swapHistory[st.swapHistory.length - 1].toId = nq.id;
        st.stats.gems -= SWAP_COST;
        Object.assign(it, { questId: nq.id, status: 'todo', steps: null, startedAt: null, source: 'swap', reason: Engine.reasonFor(st, nq, it.slot) });
        App.commit();
        Overlay.pop(wrap);
        Main.render();
        toast(`새 퀘스트로 바꿨어요 · 💎 -${SWAP_COST}`);
      });
    },
  };

  /* =========================================================
   * 20. 퀘스트 상세 · 쪼개기 · 첫마디 · 완료
   * ========================================================= */
  const Detail = {
    el: null, uid: null,
    item() { return App.state?.dailyQuests.items.find((i) => i.uid === this.uid); },
    open(uid) {
      this.uid = uid;
      const el = document.createElement('section');
      el.setAttribute('aria-label', '퀘스트 상세');
      this.el = el;
      Overlay.push(el, 'page');
      el.addEventListener('closed', () => { if (this.el === el) this.el = null; });
      this.render();
    },
    close() { if (this.el) Overlay.pop(this.el); this.el = null; },
    rerender() { if (this.el && this.el.isConnected) this.render(); },
    render() {
      const it = this.item();
      if (!it) { this.close(); return; }
      const q = QMAP[it.questId], c = CATEGORIES[q.cat];
      const scrollTop = this.el.querySelector('.page-body')?.scrollTop || 0;
      const done = it.status === 'done';
      const extra = [
        !it.steps && !done ? '<button type="button" class="btn btn-secondary mid" data-act="split">✂️ 더 작게 쪼개줘</button>' : '',
        q.together && !done ? '<button type="button" class="btn btn-secondary mid" data-act="opener">💬 첫마디 도와줘</button>' : '',
      ].filter(Boolean);
      this.el.innerHTML = `
        <header class="page-head">
          <button type="button" class="icon-btn" data-act="back" aria-label="뒤로">${BACK_ICON}</button>
          <h2>퀘스트 상세</h2>
          <span class="status-pill ${it.status}">${statusLabel[it.status]}</span>
        </header>
        <div class="page-body">
          <div class="detail-hero" style="${catVar(q.cat)}">
            <span class="cat-icon lg" aria-hidden="true">${c.emoji}</span>
            <div class="q-top"><span class="q-cat">${c.label}</span>${q.sub ? `<span class="pill">${esc(q.sub)}</span>` : ''}${q.quick ? '<span class="pill quick">⚡ 빠른 퀘스트</span>' : ''}<span class="pill">${q.together ? `👥 ${TARGETS[q.stage].target}${josaWa(TARGETS[q.stage].target)} 함께` : '🙋 혼자 하는 미션'}</span></div>
            <h1 class="detail-title">${esc(q.title)}</h1>
            <p class="detail-desc">${esc(q.desc)}</p>
          </div>
          <dl class="meta-grid">
            <div><dt>카테고리</dt><dd>${c.label}</dd></div>
            <div><dt>난이도</dt><dd>${DIFFICULTY[q.difficulty].label}</dd></div>
            <div><dt>예상 시간</dt><dd>${q.minutes}분</dd></div>
            <div><dt>보상</dt><dd class="xp">+${q.xp} XP · 💎${q.gems}</dd></div>
            <div class="wide"><dt>대상</dt><dd>${q.together ? TARGETS[q.stage].target : '혼자'}</dd></div>
          </dl>
          <div class="talk">${mascot('sm')}<p class="bubble small">${esc(q.tip)}</p></div>
          ${it.reason ? `<p class="q-reason">추천 이유 · ${esc(it.reason)}</p>` : ''}
          ${this.badgeHint(q)}
          <section class="split" aria-label="작게 쪼갠 단계">${this.splitHTML(it, q)}</section>
        </div>
        <footer class="page-foot">
          ${done
            ? '<button type="button" class="btn btn-secondary" disabled>완료한 퀘스트예요 ✓</button>'
            : '<button type="button" class="btn btn-primary" data-act="complete">완료했어요</button>'}
          ${extra.length ? `<div class="btn-row n${extra.length}">${extra.join('')}</div>` : ''}
        </footer>`;
      const body = this.el.querySelector('.page-body');
      body.scrollTop = scrollTop;
      this.el.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => this.action(b.dataset.act)));
      this.el.querySelectorAll('[data-step]').forEach((cb) => cb.addEventListener('change', () => this.check(Number(cb.dataset.step))));
      this.el.querySelector('[data-badge]')?.addEventListener('click', (e) => BadgeSheet.open(e.currentTarget.dataset.badge));
    },
    badgeHint(q) {
      const s = App.state, b = BADGE_MAP[`cat_${q.cat}`], p = Badges.progress(s, b);
      const earned = Badges.earnedIds(s).has(b.id);
      const counted = p.ids.includes(q.id);
      return `<button type="button" class="badge-hint" data-badge="${b.id}" style="${catVar(q.cat)}">
        ${badgeMedal(b, earned, 'sm')}
        <span class="q-main"><b>${esc(b.name)} 배지 ${earned ? '획득 완료' : `${p.done}/4`}</b>
          <span class="sec-sub">${earned ? esc(b.message) : counted ? '이 미션은 이미 배지 진행에 들어갔어요' : `이 미션을 완료하면 ${p.done + 1}/4가 돼요`}</span></span>
        <span class="chev" aria-hidden="true">›</span></button>`;
    },
    splitHTML(it, q) {
      if (!it.steps) return '';
      const n = it.steps.length, d = it.steps.filter((x) => x.done).length;
      let banner = '';
      if (d === 1 && n > 1) banner = '<div class="banner ok">🎉 첫 단계 성공! 여기서 멈춰도 괜찮아요. 진행 상황은 저장돼요.</div>';
      else if (d > 1 && d < n) banner = `<div class="banner ok">${d}단계까지 해냈어요! 남은 단계도 천천히 해봐요.</div>`;

          ${it.steps.map((x, i) => `<li><label class="step ${x.done ? 'done' : ''}">

    },
    action(act) {
      const it = this.item();
      if (!it) return;
      if (act === 'back') this.close();
      if (act === 'split') this.split(it);
      if (act === 'opener') Opener.open(it);
      if (act === 'complete') Complete.open(it);
    },
    split(it) {
      if (it.status === 'todo') { it.status = 'doing'; it.startedAt = nowISO(); }
      it.steps = Engine.localSplit(QMAP[it.questId]).map((x) => ({ ...x, done: false, doneAt: null }));
      App.commit();
      Main.refresh();
      toast('작은 단계로 나눴어요. 첫 단계는 2분이면 충분해요!');
    },
    check(i) {
      const s = App.state, it = this.item();
      const res = Progress.completeStep(s, it, i);
      if (!res) return;
      App.commit();
      Main.refresh();
      const all = res.doneCount === it.steps.length;
      if (all) { setTimeout(() => Complete.open(it), 350); }
      else toast(res.doneCount === 1 ? '첫 단계 성공!' : `${res.doneCount}/${it.steps.length}단계 완료`);
      if (res.after.level > res.before.level) LevelUp.show(res.before, res.after);
    },
  };

  const Opener = {
    open(it) {
      const s = App.state, q = QMAP[it.questId];
      const o = {
        rank: q.stage >= 3 ? 'senior' : 'associate',
        known: q.stage <= 2,
        channel: q.minutes <= 5 ? 'inperson' : 'messenger',

      const wrap = Sheet.open(`
        <h2 class="sheet-title">첫마디 도우미</h2>
        <p class="sec-sub">"${esc(q.title)}"를 위한 첫 메시지를 3가지 톤으로 만들어드려요.</p>
        ${q.stage === 5 ? '' : `<div class="field"><p class="field-label">상대 직급</p>${seg('rank', [['associate', 'Associate'], ['senior', 'Senior'], ['manager', 'Manager 이상']])}</div>`}
        <div class="field"><p class="field-label">아는 사이인가요?</p>${seg('known', [[false, '처음 연락해요'], [true, '아는 사이예요']])}</div>
        <div class="field"><p class="field-label">연락 방법</p>${seg('channel', [['messenger', '사내 메신저'], ['inperson', '대면']])}</div>
        <button type="button" class="btn btn-primary" id="op-go">메시지 만들기</button>

      wrap.addEventListener('click', (e) => {

      go.addEventListener('click', () => {
        const msgs = localOpeners(App.state, q, { ...o, n: tries });
        tries += 1;
        go.textContent = '다시 만들기';

        out.innerHTML = `<p class="req-note">그대로 쓰거나 조금 고쳐서 보내보세요</p>

            <div class="msg-head"><b>${l}</b><button type="button" class="btn btn-secondary xs" data-copy="${k}">복사하기</button></div>
            <p class="msg-text" id="msg-${k}">${esc(msgs[k])}</p></div>`).join('')}`;
        out.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', async () => {
          const ok = await copyText(msgs[b.dataset.copy]);
          if (ok) { toast('복사했어요!'); b.textContent = '복사됨 ✓'; setTimeout(() => { b.textContent = '복사하기'; }, 1600); }
          else {
            toast('복사가 막혀 있어요. 문장을 길게 눌러 복사해주세요.');
            const r = document.createRange(); r.selectNodeContents($(`#msg-${b.dataset.copy}`, out));
            const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
          }
        }));
      });
    },
  };

  // "완료했어요" → 바로 기록하고 축하
  const Complete = {
    busy: false,
    async open(it) {
      if (this.busy) return;
      const cur = App.state.dailyQuests.items.find((i) => i.uid === it.uid);
      if (!cur || cur.status === 'done') return;

      const res = Progress.completeQuest(App.state, cur);

      Detail.close();
      Main.render();
      await Celebration.show(res);

      for (const b of res.newBadges || []) await BadgeWin.show(b);

    },
  };

  /* =========================================================
   * 21. 축하 연출 (완료 · 레벨업 · 배지)
   * ========================================================= */
  function countUp(el, to, ms = 900) {
    if (reducedMotion()) { el.textContent = String(to); return; }
    const start = performance.now();
    const step = (t) => { const p = Math.min(1, (t - start) / ms); el.textContent = String(Math.round(to * (1 - Math.pow(1 - p, 3)))); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  function fullScreen(html, label) {
    return new Promise((resolve) => {
      const el = document.createElement('section');
      el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', label);
      el.innerHTML = `<canvas class="confetti" aria-hidden="true"></canvas><div class="full-inner">${html}</div>`;
      Overlay.push(el, 'full');
      $('#toast').classList.remove('show');
      let stop = null;
      setTimeout(() => { if (!reducedMotion() && el.isConnected) stop = runConfetti(el.querySelector('.confetti'), 2400); }, 120);
      el.querySelector('[data-continue]').addEventListener('click', () => { stop?.(); Overlay.pop(el); resolve(); });
      el.dispatchEvent(new CustomEvent('mounted'));
      Celebration.lastEl = el;
    });
  }
  const Celebration = {
    lastEl: null,
    show(res) {
      const { q, before, after, gems } = res;
      const streakUp = after.streak > before.streak;
      const goalNow = before.today < after.goal && after.today >= after.goal;
      const p = fullScreen(`
        <div class="mascot-wrap lg">${mascotSVG('jump')}</div>
        <p class="cel-label">퀘스트 완료!</p>
        <p class="xp-big">+<span data-xp>0</span> XP</p>
        <p class="sec-sub center">${esc(q.title)}</p>
        <div class="cel-row">
          <div class="cel-item"><span class="flame ${streakUp ? 'pop' : ''}" aria-hidden="true">🔥</span><b>${after.streak}일</b><small>연속 수행${streakUp ? ' +1' : ''}</small></div>
          <div class="cel-item">${ringSVG(before.today / after.goal, 56, 7, 'cel-ring')}<b>${after.today}/${after.goal}</b><small>오늘 목표</small></div>
          <div class="cel-item"><span class="gem" aria-hidden="true">💎</span><b>+${gems}</b><small>재화</small></div>
        </div>
        ${goalNow ? '<p class="banner ok center">🎯 오늘 목표 달성!</p>' : ''}
        <button type="button" class="btn btn-primary" data-continue>계속하기</button>`, '퀘스트 완료 축하');
      const el = this.lastEl;
      countUp(el.querySelector('[data-xp]'), q.xp);
      setTimeout(() => setRing(el.querySelector('.cel-ring'), after.today / after.goal), 250);
      return p;
    },
  };
  const LevelUp = {
    show(before, after) {

      return fullScreen(`
        <div class="mascot-wrap lg">${mascotSVG('jump')}</div>
        <p class="cel-label">레벨 업!</p>
        <p class="lv-big"><small>Lv.</small>${after.level}</p><p class="lv-title center">${titleOf(after.level)}</p>
        ${titleChanged ? `<p class="banner ok center">새 칭호를 얻었어요: ${titleOf(after.level)}</p>` : ''}
        <button type="button" class="btn btn-primary" data-continue>좋아요!</button>`, '레벨 업');

  const featChip = (s) => { const f = Badges.featured(s); return f ? `<span class="feat-chip" title="대표 배지"><span aria-hidden="true">${f.emoji}</span>${esc(f.name)}</span>` : ''; };
  function badgeMedal(b, earned, size = '') {
    return `<span class="medal ${size} ${earned ? '' : 'locked'}" style="--cat:${b.color}" aria-hidden="true"><span class="medal-emoji">${b.emoji}</span>${earned ? '' : '<span class="medal-lock">🔒</span>'}</span>`;
  }
  const BadgeWin = {
    show(b) {
      const p = fullScreen(`
        ${badgeMedal(b, true, 'xl')}
        <p class="cel-label">배지 획득!</p>
        <p class="badge-big-name">${esc(b.name)}</p>
        <p class="badge-msg">${esc(b.message)}</p>

  const BadgeSheet = {
    open(id) {
      const s = App.state, b = BADGE_MAP[id], p = Badges.progress(s, b);
      const rec = (s.badges.earned || []).find((e) => e.id === id);
      const isF = Badges.featured(s)?.id === id;
      const wrap = Sheet.open(`
        <div class="badge-sheet-top">${badgeMedal(b, !!rec, 'lg')}
          <div><h2 class="sheet-title">${esc(b.name)}</h2><p class="sec-sub">${rec ? `${fmtDay(rec.date)} 획득` : `진행 ${p.done}/${p.total}`}</p></div></div>
        <p class="badge-msg left">${rec ? esc(b.message) : esc(b.rule)}</p>
        ${b.kind === 'category' ? `<ul class="badge-stages">${[1, 2, 3, 4].map((n) => `<li class="${p.stages[n] ? 'on' : ''}">
            <span class="bs-check" aria-hidden="true">${p.stages[n] ? '✓' : n}</span>
            <span class="q-main"><b>${n}번째 미션</b><span class="sec-sub">${p.stages[n] ? esc(p.stages[n].title) : '아직이에요'}</span></span></li>`).join('')}</ul>` : ''}
        ${rec ? `<button type="button" class="btn ${isF ? 'btn-secondary' : 'btn-primary'}" data-feature>${isF ? '대표 배지에서 내리기' : '🏅 대표 배지로 걸기'}</button>
          <p class="sec-sub center">대표 배지는 홈의 레벨 카드와 프로필에 보여요</p>` : ''}`, '배지 상세');
      wrap.querySelector('[data-feature]')?.addEventListener('click', () => {
        Badges.setFeatured(s, isF ? null : id); App.commit();
        Overlay.pop(wrap); Main.render();

  /* =========================================================
   * 23. 기록 탭 · 주간 리포트
   * ========================================================= */
  function weekChartSVG(s) {
    const today = Clock.today();
    const days = Array.from({ length: 7 }, (_, i) => addDays(today, i - 6));
    const vals = days.map((d) => s.stats.dailyXP[d] || 0);
    const goal = Progress.goal(s);
    const W = 320, H = 170, top = 22, bottom = 26, left = 8, right = 8;
    const max = Math.max(goal, ...vals) * 1.15 || 1;
    const slot = (W - left - right) / 7, bw = Math.min(28, slot * 0.6);
    const y = (v) => top + (H - top - bottom) * (1 - v / max);
    const gy = y(goal);
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 7일 XP: ${days.map((d, i) => `${fmtShort(d)} ${vals[i]}`).join(', ')}">
      <line class="ch-grid" x1="${left}" x2="${W - right}" y1="${H - bottom}" y2="${H - bottom}"/>
      <line class="ch-goal" x1="${left}" x2="${W - right}" y1="${gy}" y2="${gy}"/>
      <text class="ch-goal-t" x="${W - right}" y="${gy - 5}" text-anchor="end">목표 ${goal}</text>
      ${days.map((d, i) => {
        const x = left + slot * i + (slot - bw) / 2, v = vals[i], by = y(v), isT = d === today;
        const hit = v >= goal;
        return `<g>
          ${v > 0 ? `<rect class="ch-bar ${isT ? 'today' : ''} ${hit ? 'hit' : ''}" x="${x}" y="${by}" width="${bw}" height="${H - bottom - by}" rx="6"/>
          <text class="ch-val" x="${x + bw / 2}" y="${by - 5}" text-anchor="middle">${v}</text>` : ''}
          <text class="ch-day ${isT ? 'today' : ''}" x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${isT ? '오늘' : DOW[parseKey(d).getDay()]}</text>
        </g>`;
      }).join('')}
    </svg>`;
  }

  const RecordsTab = {
    render(el) {
      const s = App.state;
      const wk = weekStartKey(Clock.today());
      const sum = weekSummary(s, wk);
      const quests = s.questHistory.filter((h) => h.kind === 'quest').slice().reverse();

        ...Object.keys(CATEGORIES).map((c) => [c, `${CATEGORIES[c].emoji} ${CATEGORIES[c].label}`, catCount(c)])];
      if (!filters.some(([id]) => id === Main.histFilter)) Main.histFilter = 'all';
      const f = Main.histFilter;
      const fi = filters.findIndex(([id]) => id === f);
      const list = quests.filter((h) => f === 'all' || h.category === f);
      const byDate = {};
      list.forEach((h) => { (byDate[h.date] = byDate[h.date] || []).push(h); });
      el.innerHTML = `
        <button type="button" class="card report-link" id="open-report">
          <span class="report-ico" aria-hidden="true">📊</span>
          <span class="q-main"><b class="sec-title sm">이번 주 리포트</b><span class="sec-sub">${fmtShort(wk)}~${fmtShort(sum.end)} · 완료 ${sum.quests}개 · +${sum.xp} XP</span></span>
          <span class="chev" aria-hidden="true">›</span>
        </button>
        <section class="card">
          <div class="sec-head"><h2 class="sec-title sm">최근 7일 XP</h2><span class="sec-sub">하루 목표 ${Progress.goal(s)} XP</span></div>
          ${weekChartSVG(s)}
        </section>
        <section class="sec" aria-labelledby="h-badges">
          <div class="sec-head"><h2 class="sec-title" id="h-badges">배지 컬렉션</h2><span class="sec-sub">${Badges.earnedIds(s).size}/${BADGES.length} 획득</span></div>
          ${Badges.earnedIds(s).size ? '<p class="sec-sub">얻은 배지를 누르면 대표 배지로 걸 수 있어요</p>' : ''}
          <div class="badge-grid">${BADGES.map((b) => {
            const earned = Badges.earnedIds(s).has(b.id), pr = Badges.progress(s, b), feat = Badges.featured(s)?.id === b.id;
            return `<button type="button" class="badge-tile ${earned ? 'earned' : ''} ${feat ? 'featured' : ''}" data-badge="${b.id}" aria-label="${esc(b.name)} ${feat ? '대표 배지' : earned ? '획득' : `진행 ${pr.done}/${pr.total}`}">
              ${badgeMedal(b, earned)}<span class="bt-name">${esc(b.name)}</span>
              <span class="bt-sub">${feat ? '🏅 대표 배지' : earned ? '획득!' : b.kind === 'category' ? `<span class="pips">${[1, 2, 3, 4].map((n) => `<i class="${pr.stages[n] ? 'on' : ''}"></i>`).join('')}</span>` : '0/1'}</span></button>`;
          }).join('')}</div>
        </section>
        <section class="sec">
          <div class="sec-head"><h2 class="sec-title">완료한 퀘스트</h2><span class="sec-sub">총 ${quests.length}개</span></div>
          ${quests.length ? `<div class="cat-swiper" role="group" aria-label="카테고리 넘기기">
            <button type="button" class="cs-arrow" data-step="-1" aria-label="이전 카테고리"${fi <= 0 ? ' disabled' : ''}>‹</button>
            <div class="filter-row cs-track" id="hist-filters">
              ${filters.map(([id, label, n]) => `<button type="button" class="tag sm ${n ? '' : 'is-zero'}" data-f="${id}" aria-pressed="${f === id}">${label} <span class="cs-n">${n}</span></button>`).join('')}
            </div>
            <button type="button" class="cs-arrow" data-step="1" aria-label="다음 카테고리"${fi >= filters.length - 1 ? ' disabled' : ''}>›</button>
          </div>` : ''}
          ${list.length ? Object.entries(byDate).map(([d, hs]) => `
            <div class="hist-day"><h3 class="hist-date">${fmtDay(d)}${d === Clock.today() ? ' · 오늘' : ''}</h3>
              ${hs.map((h) => `<div class="hist-item" style="${catVar(h.category)}">
                <span class="cat-icon sm" aria-hidden="true">${CATEGORIES[h.category].emoji}</span>
                <span class="q-main"><span class="q-title sm">${esc(h.title)}</span></span>
                <span class="xp">+${h.xp}</span></div>`).join('')}
            </div>`).join('') : `<div class="empty">${mascot('sm')}<p>${quests.length && f !== 'all' ? `아직 완료한 ${CATEGORIES[f].label} 퀘스트가 없어요.<br>‹ › 를 눌러 다른 카테고리도 넘겨보세요` : '아직 완료한 퀘스트가 없어요.<br>홈에서 ⚡ 빠른 퀘스트부터 시작해보세요!'}</p></div>`}
        </section>`;
      $('#open-report', el).addEventListener('click', () => Report.open(wk));
      el.querySelectorAll('[data-badge]').forEach((b) => b.addEventListener('click', () => BadgeSheet.open(b.dataset.badge)));
      const track = $('#hist-filters', el);
      const prevScroll = Main.histScroll || 0;
      const setFilter = (id) => { Main.histScroll = track ? track.scrollLeft : 0; Main.histFilter = id; Main.render(); };
      el.querySelectorAll('[data-f]').forEach((b) => b.addEventListener('click', () => setFilter(b.dataset.f)));
      el.querySelectorAll('[data-step]').forEach((b) => b.addEventListener('click', () => {
        const n = fi + Number(b.dataset.step);
        if (filters[n]) setFilter(filters[n][0]);
      }));
      if (track) {
        // 이전 스크롤 위치에서 시작해 선택한 칩이 가운데 오도록 부드럽게 이동 (페이지는 움직이지 않음)
        track.scrollLeft = prevScroll;
        const on = track.querySelector('[aria-pressed="true"]');
        if (on) {
          const target = on.offsetLeft - (track.clientWidth - on.offsetWidth) / 2;
          requestAnimationFrame(() => track.scrollTo({ left: Math.max(0, target), behavior: 'smooth' }));
        }
      }
    },
  };

  const Report = {
    open(wk = weekStartKey(Clock.today())) {
      const s = App.state;
      const sum = weekSummary(s, wk), prev = weekSummary(s, addDays(wk, -7));
      const saved = s.weeklyReports[wk];
      const comment = localWeeklyComment(sum);
      const delta = (a, b) => (a > b ? `<span class="up">▲ ${a - b}</span>` : '');
      const total = sum.quests || 1;
      const catRows = Object.entries(sum.byCat).sort((a, b) => b[1] - a[1]);
      const el = document.createElement('section');
      el.setAttribute('aria-label', '주간 리포트');
      const draw = () => {
        el.innerHTML = `
          <header class="page-head"><button type="button" class="icon-btn" data-close-page aria-label="닫기">${BACK_ICON}</button><h2>이번 주 리포트</h2><span class="sec-sub">${fmtShort(wk)}~${fmtShort(sum.end)}</span></header>
          <div class="page-body">
            <div class="talk">${mascot('sm')}<div class="bubble report-bubble"><p>${esc(comment.comment)}</p><p class="next">👉 ${esc(comment.next)}</p></div></div>
            <div class="tiles">
              <div class="tile"><small>완료한 퀘스트</small><b>${sum.quests}<span>개</span></b>${delta(sum.quests, prev.quests)}<em>지난주 ${prev.quests}</em></div>
              <div class="tile"><small>획득 XP</small><b>${sum.xp}<span>XP</span></b>${delta(sum.xp, prev.xp)}<em>지난주 ${prev.xp}</em></div>
              <div class="tile"><small>함께한 퀘스트</small><b>${sum.people}<span>개</span></b>${delta(sum.people, prev.people)}<em>지난주 ${prev.people}</em></div>            </div>
            <section class="card">
              <h3 class="sec-title sm">카테고리별 비율</h3>
              ${catRows.length ? `<div class="catbars">${catRows.map(([c, n]) => `<div class="catbar" style="${catVar(c)}">
                <span class="cb-label">${CATEGORIES[c].emoji} ${CATEGORIES[c].label}</span>
                <span class="cb-track"><span class="cb-fill" style="width:${(n / total) * 100}%"></span></span>
                <span class="cb-val">${Math.round((n / total) * 100)}%</span></div>`).join('')}</div>` : '<p class="sec-sub">이번 주에는 아직 완료한 퀘스트가 없어요.</p>'}
              <div class="most-least">
                <div><small>가장 많이 한</small><b>${sum.most ? `${CATEGORIES[sum.most].emoji} ${CATEGORIES[sum.most].label} ${sum.byCat[sum.most]}개` : '-'}</b></div>
                <div><small>가장 적게 한</small><b>${sum.least ? `${CATEGORIES[sum.least].emoji} ${CATEGORIES[sum.least].label} ${sum.byCat[sum.least] || 0}개` : '-'}</b></div>
              </div>
            </section>
          </div>
          <footer class="page-foot"><button type="button" class="btn btn-primary" data-close-page>확인</button></footer>`;
        el.querySelectorAll('[data-close-page]').forEach((b) => b.addEventListener('click', () => Overlay.pop(el)));
      };
      draw();
      Overlay.push(el, 'page');
      s.weeklyReports[wk] = { quests: sum.quests, xp: sum.xp, people: sum.people, byCat: sum.byCat, comment, generatedAt: nowISO() };
      App.commit();
    },
  };

  /* =========================================================
   * 24. 설정 탭 · 데모
   * ========================================================= */
  function buildDemoState() {
    const prev = App.state;
    const profile = prev?.profile || demoProfile();
    const s = createInitialState(profile);
    s.meta.dayOffset = prev?.meta?.dayOffset || 0;
    s.settings.busySeason = false;
    const today = Clock.today();
    // [며칠 전, 퀘스트 id]
    const plan = [
      [13, 'Q007'], [12, 'Q108'], [12, 'Q102'], [10, 'Q107'], [9, 'Q065'], [9, 'Q044'], [8, 'Q023'],
      [7, 'Q014'], [5, 'Q053'], [5, 'Q135'], [4, 'Q001'], [3, 'Q113'], [3, 'Q117'], [2, 'Q026'],
      [1, 'Q148'], [1, 'Q121'], [1, 'Q067'],
    ];
    plan.forEach(([ago, id], i) => {
      const q = QMAP[id], date = addDays(today, -ago);
      s.questHistory.push({ kind: 'quest', uid: `demo-${i}`, questId: id, title: q.title, category: q.cat, stage: q.stage, together: q.together, xp: q.xp, date, completedAt: `${date}T12:00:00.000Z` });
      s.stats.dailyXP[date] = (s.stats.dailyXP[date] || 0) + q.xp;
      s.stats.totalXP += q.xp;
    });
    [[4, 'Q001'], [4, 'Q001'], [2, 'Q026']].forEach(([ago, id], i) => {
      const date = addDays(today, -ago);
      s.questHistory.push({ kind: 'step', uid: `demo-step-${i}`, questId: id, category: QMAP[id].cat, date, completedAt: `${date}T09:00:00.000Z`, xp: STEP_XP, step: i });
      s.stats.dailyXP[date] += STEP_XP; s.stats.totalXP += STEP_XP;
    });
    s.swapHistory.push({ date: addDays(today, -6), at: nowISO(), fromId: 'Q150', category: 'event', reason: 'no_time', toId: 'Q143' });
    s.swapHistory.push({ date: addDays(today, -3), at: nowISO(), fromId: 'Q057', category: 'health', reason: 'burden', toId: 'Q053' });
    s.stats.level = levelOf(s.stats.totalXP);
    Badges.check(s);
    s.badges.earned.forEach((e, i) => { e.date = addDays(today, -(12 - i * 11)); });
    s.stats.streak = 5; s.stats.bestStreak = 5; s.stats.lastActiveDate = addDays(today, -1);
    s.stats.gems = START_GEMS + plan.reduce((sum, [, id]) => sum + QMAP[id].gems, 0) - 2 * SWAP_COST;
    s.meta.reportAutoWeek = weekStartKey(today);
    return s;
  }

  const SettingsTab = {
    resetTimer: null,
    render(el) {
      const s = App.state, p = s.profile, demoOn = !!s.meta.demoMode;
      el.innerHTML = `
        <section class="card">
          <div class="profile-row">${mascot('sm')}<div class="q-main"><b class="sec-title sm">${esc(p.nickname)}</b><span class="sec-sub">${esc(divisionOf(p.division)?.label || '-')} · ${esc(p.team)} · 입사 ${tenureMonth(p.joinMonth)}개월차</span>${featChip(s)}</div></div>
          <button type="button" class="btn btn-secondary" id="edit-profile">프로필 수정</button>
        </section>

        <section class="sec">
          <h2 class="sec-title">하루 목표 XP</h2>
          <div class="choice-list compact" role="radiogroup" aria-label="하루 목표">
            ${DAILY_GOALS.map((g) => `<button type="button" class="choice" role="radio" data-id="${g.xp}" aria-checked="${p.dailyGoalXP === g.xp}">
              <span class="choice-text"><span class="choice-title">${g.label}</span><span class="choice-desc">${g.desc}</span></span><span class="xp-pill">${g.xp} XP</span></button>`).join('')}
          </div>
        </section>

        <section class="card set-row">
          <div class="q-main"><b class="sec-title sm">🛡️ Busy Season 모드</b>
            <span class="sec-sub">하루 목표가 절반으로 줄고, 하루를 쉬어도 연속 기록이 끊기지 않아요</span></div>
          <button type="button" class="switch" role="switch" id="busy" aria-checked="${s.settings.busySeason}" aria-label="Busy Season 모드"><span></span></button>
        </section>


        <section class="sec">
          <h2 class="sec-title">시연용 도구</h2>
          <div class="demo-box">
            <p>발표에서 여러 날을 빠르게 보여주기 위한 도구예요. 실제 사용할 때는 자정이 지나면 날짜가 자동으로 넘어가요.</p>
            <p>오늘 날짜(가상): <b>${fmtDay(Clock.today())}</b>${Clock.offset ? ` · 실제보다 +${Clock.offset}일` : ''}</p>
            <div class="demo-toggle">
              <div class="q-main"><b>데모 데이터</b><span class="sec-sub">${demoOn ? '2주 분량 예시 기록을 보는 중이에요. 끄면 내 기록으로 돌아가요' : '켜면 2주 분량 예시 기록으로 바뀌어요. 내 기록은 따로 보관돼요'}</span></div>
              <button type="button" class="switch sm" role="switch" id="demo-toggle" aria-checked="${demoOn}" aria-label="데모 데이터"><span></span></button>
            </div>
            <button type="button" class="btn btn-secondary" data-demo="report">주간 리포트 바로 보기</button>
            <button type="button" class="btn btn-secondary" data-demo="nextday">날짜 하루 넘기기 (시연용)</button>
            <button type="button" class="btn btn-secondary" data-demo="reset">전체 초기화</button>
          </div>
        </section>
        <p class="save-state">${Store.persistent ? '이 브라우저에 저장됨 · 새로고침해도 유지돼요' : '임시 저장 중 · 새로고침하면 사라져요'}</p>`;
      this.bind(el);
    },
    bind(el) {
      const s = App.state;
      $('#edit-profile', el).addEventListener('click', () => Onboarding.start({ profile: s.profile, step: STEP.CONFIRM, mode: 'edit' }));
      radioGroup(el.querySelector('[aria-label="하루 목표"]'), (id) => {
        s.profile.dailyGoalXP = Number(id);
        App.commit(); StatusBar.render();
        toast(`하루 목표를 ${id} XP로 바꿨어요`);
      });
      $('#busy', el).addEventListener('click', () => {
        s.settings.busySeason = !s.settings.busySeason;
        App.commit(); Main.render();
        toast(s.settings.busySeason ? 'Busy Season 모드를 켰어요. 무리하지 말아요!' : 'Busy Season 모드를 껐어요');
      });
      el.querySelectorAll('[data-demo]').forEach((b) => b.addEventListener('click', () => this.demo(b.dataset.demo, b)));
      $('#demo-toggle', el).addEventListener('click', (e) => this.toggleDemo(e.currentTarget));
    },
    // 데모 데이터 토글: 켜면 내 기록을 따로 보관하고 예시 기록으로, 끄면 보관한 내 기록으로 복원
    async toggleDemo(btn) {
      if (btn.disabled) return;
      btn.disabled = true;
      const on = !App.state.meta.demoMode;
      try {
        if (on) {
          if (!DemoBackup.save(App.state)) { toast('내 기록을 보관하지 못해서 데모로 바꾸지 않았어요.'); return; }
          const demo = buildDemoState();
          demo.meta.demoMode = true;
          App.setState(demo);
          Main.enter('settings');
          toast('데모 데이터로 바꿨어요 (2주 기록 + 배지)');
        } else {
          const real = DemoBackup.load();
          if (real) {
            App.setState(real);
            DemoBackup.clear();
            Main.enter('settings');
            toast('내 기록으로 돌아왔어요');
          } else {
            App.state.meta.demoMode = false; App.commit(); Main.render();
            toast('보관된 내 기록이 없어서 지금 기록을 그대로 쓸게요');
          }
        }
      } finally { btn.disabled = false; }
    },
    async demo(kind, btn) {
      if (kind === 'report') Report.open(weekStartKey(Clock.today()));
      if (kind === 'nextday') {
        const s = App.state;
        s.meta.dayOffset = (s.meta.dayOffset || 0) + 1;
        Clock.offset = s.meta.dayOffset;
        const before = s.stats.streak;
        Main.ensureToday();
        App.commit();
        Main.render();
        const msg = s.stats.streak === 0 && before > 0 ? '하루를 비워서 연속 기록이 0이 됐어요' : s.settings.busySeason ? '🛡️ Busy Season 덕분에 연속 기록이 유지돼요' : `연속 기록 ${s.stats.streak}일 유지 중`;
        toast(`${fmtDay(Clock.today())} · 새 퀘스트 준비 완료 · ${msg}`);
      }
      if (kind === 'reset') {
        if (btn.dataset.armed !== '1') {
          btn.dataset.armed = '1'; btn.classList.add('is-armed'); btn.textContent = '한 번 더 누르면 모든 데이터가 삭제돼요';
          clearTimeout(this.resetTimer);
          this.resetTimer = setTimeout(() => { btn.dataset.armed = ''; btn.classList.remove('is-armed'); btn.textContent = '전체 초기화'; }, 3500);
          return;
        }
        clearTimeout(this.resetTimer);
        Store.clear();
        DemoBackup.clear();
        App.state = null;
        Clock.offset = 0;
        Overlay.clear();
        Onboarding.start();
      }
    },
  };

  const DemoBackup = {
    key: `${STORAGE_KEY}:real`,
    save(state) { try { localStorage.setItem(this.key, JSON.stringify(state)); return true; } catch (e) { return false; } },
    load() { try { const raw = localStorage.getItem(this.key); return raw ? migrate(JSON.parse(raw)) : null; } catch (e) { return null; } },
    clear() { try { localStorage.removeItem(this.key); } catch (e) { /* 무시 */ } },
  };
  /* 다음 단계에서 콘솔/다른 모듈이 접근할 수 있도록 노출 */
  window.AssociateQuest = {
    App, Store, Onboarding, Main, Detail, Report, Engine, Progress, Clock, Badges, STEP,
    constants: { DIVISIONS, INTEREST_GROUPS, NETWORKING_STYLES, DAILY_GOALS, XP_PER_LEVEL, QUESTS, CATEGORIES, TARGETS, BADGES },
    helpers: { createInitialState, migrate, normalizeProfile, levelInfo, levelOf, titleOf, tenureMonth, mascotSVG, weekSummary, localOpeners, buildDemoState },
  };

  // 인증 사진·영상 기능을 없애면서 예전에 저장된 파일 정리
  try { indexedDB.deleteDatabase('associate-quest-media'); } catch (e) { /* 저장 공간을 못 열면 건너뜀 */ }

  App.init();
})();
</script>
</body>
</html>
