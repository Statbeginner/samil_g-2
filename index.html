<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="1년차 신입 공인회계사를 위한 사내 네트워킹 퀘스트 게임형 웹앱">
<meta property="og:title" content="Associate Quest">
<meta property="og:description" content="매일 작은 퀘스트로 새로운 동료와 경험을 만나보세요">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='12' y='4' width='40' height='56' rx='11' fill='%23F7893B' stroke='%23C4500B' stroke-width='3'/%3E%3Crect x='18' y='11' width='28' height='18' rx='5' fill='%23FFF6EC'/%3E%3Ccircle cx='27' cy='19' r='2.5' fill='%232B2118'/%3E%3Ccircle cx='37' cy='19' r='2.5' fill='%232B2118'/%3E%3Crect x='18' y='35' width='8' height='6' rx='2' fill='%23FFE3CC'/%3E%3Crect x='28' y='35' width='8' height='6' rx='2' fill='%23FFE3CC'/%3E%3Crect x='38' y='35' width='8' height='6' rx='2' fill='%23FFE3CC'/%3E%3Crect x='18' y='45' width='8' height='6' rx='2' fill='%23FFE3CC'/%3E%3Crect x='28' y='45' width='8' height='6' rx='2' fill='%23FFE3CC'/%3E%3Crect x='38' y='45' width='8' height='6' rx='2' fill='%231E5F74'/%3E%3C/svg%3E">
<title>Associate Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* Layout: 휴대폰 한 화면(최대 480px) 앱. 상단 진행바 · 가운데 단계 패널(좌우 슬라이드) · 하단 고정 입체 버튼 */
:root {
  --backdrop: #EFE7E0;
  --bg: #FCF8F5;
  --surface: #FFFFFF;
  --surface-2: #F5EDE6;
  --line: #E8DCD2;
  --track: #EFE4DA;
  --fg: #2A211B;
  --fg-muted: #786A5F;
  --brand: #F26B1D;
  --brand-deep: #C4500B;
  --brand-soft: #FFEADB;
  --on-brand: #FFFFFF;
  --accent: #1E5F74;
  --accent-deep: #123E4D;
  --accent-soft: #E0EFF3;
  --danger: #D23A3F;
  --disabled: #E4DBD3;
  --disabled-deep: #CBBFB5;
  --disabled-fg: #9A8C81;
  --shadow: rgba(80, 45, 20, .22);
  --success: #23854D;
  --success-soft: #DDF3E5;
  --gold: #F2A900;
  --gold-soft: #FFF0C2;
  --gold-fg: #8A5A00;

  --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --ease: cubic-bezier(.22, .8, .26, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --backdrop: #0E0B09; --bg: #18130F; --surface: #221B16; --surface-2: #2B231D; --line: #3B3029; --track: #33291F;
    --fg: #F6EEE7; --fg-muted: #B4A598; --brand: #F5762A; --brand-deep: #A8470A; --brand-soft: #3B2416; --on-brand: #FFFFFF;
    --accent: #72C4D8; --accent-deep: #3E8BA0; --accent-soft: #15303A; --danger: #FF7276;
    --disabled: #352B24; --disabled-deep: #261E19; --disabled-fg: #7D6F64; --shadow: rgba(0, 0, 0, .5);
    --success: #5FD18E; --success-soft: #173826; --gold: #FFC93D; --gold-soft: #3A2F0F; --gold-fg: #FFD56A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --backdrop: #0E0B09; --bg: #18130F; --surface: #221B16; --surface-2: #2B231D; --line: #3B3029; --track: #33291F;
  --fg: #F6EEE7; --fg-muted: #B4A598; --brand: #F5762A; --brand-deep: #A8470A; --brand-soft: #3B2416; --on-brand: #FFFFFF;
  --accent: #72C4D8; --accent-deep: #3E8BA0; --accent-soft: #15303A; --danger: #FF7276;
  --disabled: #352B24; --disabled-deep: #261E19; --disabled-fg: #7D6F64; --shadow: rgba(0, 0, 0, .5);
    --success: #5FD18E; --success-soft: #173826; --gold: #FFC93D; --gold-soft: #3A2F0F; --gold-fg: #FFD56A;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--backdrop);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- 앱 프레임 ---------- */
.app {
  position: relative;
  width: 100%;
  max-width: 480px;
  height: 100%;
  margin: 0 auto;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
@media (min-width: 560px) {
  body { display: flex; align-items: center; justify-content: center; padding-block: 24px; }
  .app { height: min(880px, 100%); border-radius: 32px; box-shadow: 0 0 0 1px var(--line), 0 30px 60px -24px var(--shadow); }
}
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* ---------- 마스코트 ---------- */
.mascot-wrap { flex: none; width: 84px; animation: bob 2.8s ease-in-out infinite; }
.mascot-wrap.xl { width: 156px; }
.mascot-wrap.lg { width: 128px; }
.mascot-wrap.sm { width: 64px; }
.mascot { display: block; width: 100%; height: auto; transform-origin: 50% 100%; overflow: visible; }
.mascot.hop { animation: hop .62s var(--ease); }
.mascot .m-eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
.mascot .m-arm-r { transform-box: fill-box; transform-origin: 0% 100%; }
.mascot-wrap.wave .m-arm-r { animation: wave 1.2s ease-in-out .4s 2; }
.mascot.jump { animation: jump .9s var(--ease) infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes hop {
  0% { transform: none; }
  20% { transform: scale(1.08, .9); }
  50% { transform: translateY(-16px) scale(.95, 1.06); }
  80% { transform: scale(1.04, .96); }
  100% { transform: none; }
}
@keyframes jump {
  0%, 100% { transform: translateY(0) scale(1.06, .94); }
  45% { transform: translateY(-34px) scale(.96, 1.05) rotate(-4deg); }
  60% { transform: translateY(-34px) scale(.96, 1.05) rotate(4deg); }
}
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes wave { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-22deg); } 65% { transform: rotate(14deg); } }

/* ---------- 말풍선 ---------- */
.talk { display: flex; align-items: flex-end; gap: 12px; }
.bubble {
  position: relative;
  flex: 1;
  min-width: 0;
  margin: 0 0 18px;
  padding: 14px 16px;
  background: var(--surface);
  border: 2px solid var(--line);
  border-radius: 18px;
  font-family: var(--font-display);
  font-size: 20px;
  line-height: 1.4;
  word-break: keep-all;
  text-wrap: balance;
  animation: pop .4s var(--ease) both;
}
.bubble::after {
  content: "";
  position: absolute;
  left: -9px;
  bottom: 16px;
  width: 15px;
  height: 15px;
  background: var(--surface);
  border-left: 2px solid var(--line);
  border-bottom: 2px solid var(--line);
  transform: rotate(45deg);
}
.bubble.down { flex: none; margin: 0 0 6px; text-align: center; }
.bubble.down::after { left: 50%; bottom: -9px; margin-left: -8px; transform: rotate(-45deg); }
@keyframes pop { from { opacity: 0; transform: scale(.92) translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- 온보딩 프레임 ---------- */
.ob-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px 4px; }
.ob-header.is-hidden > * { visibility: hidden; }
.icon-btn {
  flex: none; width: 44px; height: 44px; display: grid; place-items: center;
  border: 0; border-radius: 12px; background: transparent; color: var(--fg-muted);
}
.icon-btn:hover { background: var(--surface-2); }
.progress { flex: 1; height: 16px; border-radius: 999px; background: var(--track); overflow: hidden; }
.progress-fill {
  position: relative; height: 100%; width: 0; border-radius: inherit; background: var(--brand);
  transition: width .55s var(--ease);
}
.progress-fill::after {
  content: ""; position: absolute; left: 8px; right: 8px; top: 4px; height: 4px; border-radius: 4px;
  background: rgba(255, 255, 255, .35);
}
.progress-count { flex: none; min-width: 34px; font-family: var(--font-display); font-size: 14px; color: var(--fg-muted); text-align: right; font-variant-numeric: tabular-nums; }

.ob-viewport { position: relative; flex: 1; min-height: 0; overflow: hidden; }
.pane {
  position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: 12px 20px 28px;
  display: flex; flex-direction: column; gap: 22px;
  transition: transform .36s var(--ease), opacity .36s var(--ease);
}
.pane.from-right { transform: translateX(100%); opacity: 0; }
.pane.from-left { transform: translateX(-100%); opacity: 0; }
.pane.to-left { transform: translateX(-40%); opacity: 0; }
.pane.to-right { transform: translateX(40%); opacity: 0; }
.pane-body { display: flex; flex-direction: column; gap: 14px; }

.ob-footer {
  padding: 14px 20px calc(18px + env(safe-area-inset-bottom, 0px));
  border-top: 2px solid var(--line);
  background: var(--bg);
}

/* ---------- 입체 버튼 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%; min-height: 54px; padding: 12px 20px;
  border: 0; border-radius: 16px;
  font-family: var(--font-display); font-size: 19px; letter-spacing: .02em;
  transition: transform .08s ease, box-shadow .08s ease, background-color .2s ease, color .2s ease;
}
.btn-primary { background: var(--brand); color: var(--on-brand); box-shadow: 0 5px 0 var(--brand-deep); }
.btn-primary:hover:not(:disabled) { filter: brightness(1.04); }
.btn-primary:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 0 0 var(--brand-deep); }
.btn-accent { background: var(--accent); color: var(--bg); box-shadow: 0 4px 0 var(--accent-deep); }
.btn-accent:active { transform: translateY(4px); box-shadow: 0 0 0 var(--accent-deep); }
.btn-secondary { background: var(--surface); color: var(--fg); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
.btn-secondary:active { transform: translateY(4px); box-shadow: 0 0 0 var(--line); }
.btn-secondary.is-armed { border-color: var(--danger); color: var(--danger); box-shadow: 0 4px 0 var(--danger); }
.btn:disabled { background: var(--disabled); color: var(--disabled-fg); box-shadow: 0 5px 0 var(--disabled-deep); cursor: not-allowed; }
.btn.sm { width: auto; min-height: 48px; font-size: 16px; padding: 10px 18px; }

/* ---------- 입력 ---------- */
.field { display: flex; flex-direction: column; gap: 8px; }
.text-input {
  width: 100%; min-height: 56px; padding: 0 16px;
  font-size: 18px; border: 2px solid var(--line); border-radius: 14px;
  background: var(--surface-2); color: var(--fg);
  transition: border-color .15s, background-color .15s;
}
.text-input.sm { min-height: 48px; font-size: 16px; }
.text-input::placeholder { color: var(--fg-muted); opacity: .8; }
.text-input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.text-input.is-invalid { border-color: var(--danger); }
.field-meta { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; min-height: 22px; }
.field-error { margin: 0; color: var(--danger); font-size: 14px; }
.counter { flex: none; font-size: 13px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.hint { margin: 0; display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--fg-muted); }
.hint svg { flex: none; margin-top: 2px; color: var(--accent); }

/* ---------- 선택 카드 ---------- */
.choice-list { display: flex; flex-direction: column; gap: 12px; }
.choice {
  display: flex; align-items: center; gap: 14px; width: 100%; min-height: 68px;
  padding: 12px 16px; text-align: left;
  border: 2px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--fg);
  box-shadow: 0 4px 0 var(--line);
  transition: transform .18s var(--ease), border-color .15s, background-color .15s, box-shadow .15s;
}
.choice:hover { border-color: var(--disabled-deep); }
.choice[aria-checked="true"] { border-color: var(--brand); background: var(--brand-soft); box-shadow: 0 4px 0 var(--brand); transform: scale(1.02); }
.choice-icon {
  flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
  background: var(--surface-2); color: var(--accent); transition: background-color .15s, color .15s;
}
.choice[aria-checked="true"] .choice-icon { background: var(--brand); color: var(--on-brand); }
.choice-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.choice-title { font-family: var(--font-display); font-size: 18px; line-height: 1.3; }
.choice-desc { font-size: 14px; color: var(--fg-muted); word-break: keep-all; }
.xp-pill {
  flex: none; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent);
  font-family: var(--font-display); font-size: 15px; font-variant-numeric: tabular-nums;
}
.mini-tag { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--brand); color: var(--on-brand); font-size: 12px; vertical-align: 2px; }

.choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice.tall { flex-direction: column; align-items: stretch; text-align: center; padding: 12px; min-height: 0; }
.choice.tall .choice-text { align-items: center; gap: 2px; }
.illust { width: 100%; height: auto; border-radius: 12px; display: block; }
.il-bg { fill: var(--surface-2); }
.choice[aria-checked="true"] .il-bg { fill: var(--surface); }
.il-a { fill: var(--brand); }
.il-b { fill: var(--accent); }
.il-c { fill: var(--surface); stroke: var(--line); stroke-width: 2; }
.il-d { fill: var(--line); }

/* ---------- 입사 월 ---------- */
.seg-group { display: flex; gap: 8px; }
.seg, .month {
  min-height: 48px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface);
  box-shadow: 0 3px 0 var(--line); font-family: var(--font-display); font-size: 16px; color: var(--fg);
  transition: transform .15s var(--ease), background-color .15s, border-color .15s;
}
.seg { flex: 1; }
.seg[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); box-shadow: 0 3px 0 var(--accent-deep); }
.months { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.month[aria-checked="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); box-shadow: 0 3px 0 var(--brand-deep); transform: scale(1.05); }
.month:disabled { opacity: .35; box-shadow: none; cursor: not-allowed; }
.tenure {
  display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border-radius: 14px;
  background: var(--accent-soft); color: var(--accent); font-family: var(--font-display); font-size: 18px;
  animation: pop .35s var(--ease);
}
.tenure small { font-family: var(--font-body); font-size: 14px; }
.tenure.celebrate { background: var(--brand-soft); color: var(--brand-deep); }
:root[data-theme="dark"] .tenure.celebrate { color: var(--brand); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tenure.celebrate { color: var(--brand); } }

/* ---------- 관심사 태그 ---------- */
.tag-top { display: flex; justify-content: space-between; align-items: center; }
.group-label { margin: 0; font-family: var(--font-display); font-size: 15px; color: var(--fg-muted); letter-spacing: .04em; }
.count {
  font-family: var(--font-display); font-size: 14px; padding: 4px 12px; border-radius: 999px;
  background: var(--surface-2); color: var(--fg-muted); font-variant-numeric: tabular-nums; transition: background-color .2s, color .2s;
}
.count.on { background: var(--brand-soft); color: var(--brand); }
.tag-group { display: flex; flex-direction: column; gap: 10px; }
.tags { display: flex; flex-wrap: wrap; gap: 10px; }
.tag {
  min-height: 44px; padding: 0 16px; border-radius: 999px;
  border: 2px solid var(--line); background: var(--surface); color: var(--fg);
  box-shadow: 0 3px 0 var(--line);
  font-family: var(--font-display); font-size: 16px;
  transition: transform .18s var(--ease), background-color .15s, border-color .15s, color .15s;
}
.tag[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--on-brand); box-shadow: 0 3px 0 var(--brand-deep); transform: scale(1.06); }
.tag.tag-add { border-style: dashed; color: var(--accent); box-shadow: none; }
.tag.cat-tag { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; padding-block: 6px; }
.tag.cat-tag small { font-family: var(--font-body); font-size: 11.5px; opacity: .75; }
.tag.is-new { animation: pop .35s var(--ease); }
.custom-row { display: flex; gap: 10px; align-items: center; }
.custom-row .text-input { flex: 1; min-width: 0; }

/* ---------- 확인 카드 ---------- */
.summary { margin: 0; padding: 4px 16px; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; }
.summary-row { display: grid; grid-template-columns: 86px 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.summary-row:last-child { border-bottom: 0; }
.summary-row dt { font-size: 14px; color: var(--fg-muted); }
.summary-row dd { margin: 0; min-width: 0; font-family: var(--font-display); font-size: 16px; word-break: keep-all; overflow-wrap: anywhere; }
.edit-btn { min-width: 52px; min-height: 44px; border: 0; border-radius: 10px; background: transparent; color: var(--accent); font-family: var(--font-display); font-size: 15px; }
.edit-btn:hover { background: var(--accent-soft); }

/* ---------- 웰컴 ---------- */
/* 가운데 정렬은 위아래 auto 여백으로: 화면이 낮아 넘치면 위가 잘리지 않고 스크롤된다 */
.pane.welcome { align-items: center; text-align: center; gap: 14px; }
.pane.welcome > :first-child { margin-top: auto; }
.pane.welcome > :last-child { margin-bottom: auto; }
@media (max-height: 640px) {
  .pane.welcome { gap: 8px; padding-top: 4px; }
  .pane.welcome .mascot-wrap.xl { width: 96px; }
  .pane.welcome .wordmark { font-size: 28px; }
}
.wordmark { margin: 6px 0 0; font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1.1; color: var(--brand); letter-spacing: .01em; }
.wordmark span { color: var(--fg); }
.lede { margin: 0; max-width: 28ch; color: var(--fg-muted); font-size: 17px; word-break: keep-all; text-wrap: balance; }

/* ---------- 완료 축하 ---------- */
.celebrate-screen { position: relative; align-items: center; justify-content: center; text-align: center; gap: 18px; padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px)); background: radial-gradient(circle at 50% 30%, var(--brand-soft), var(--bg) 62%); }
.confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.celebrate-title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 26px; line-height: 1.35; word-break: keep-all; text-wrap: balance; }
.badge-preview {
  display: flex; align-items: center; gap: 14px; width: 100%; max-width: 360px; padding: 14px 16px;
  border: 2px dashed var(--line); border-radius: 18px; background: var(--surface); text-align: left;
}
.badge-medal { flex: none; width: 60px; height: 60px; filter: grayscale(1); opacity: .55; }
.badge-name { margin: 0; font-family: var(--font-display); font-size: 17px; }
.badge-desc { margin: 0; font-size: 14px; color: var(--fg-muted); }
.celebrate-actions { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 10px; position: relative; }
.countdown { height: 6px; border-radius: 6px; background: var(--track); overflow: hidden; }
.countdown i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; }
.countdown.run i { animation: countdown var(--dur, 3s) linear forwards; }
@keyframes countdown { from { transform: scaleX(1); } to { transform: scaleX(0); } }
.countdown-label { margin: 0; font-size: 13px; color: var(--fg-muted); }

/* ---------- 임시 홈 ---------- */
.home { overflow-y: auto; padding: 0 20px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }
.home-bar {
  position: sticky; top: 0; z-index: 2; display: flex; flex-direction: column; gap: 10px;
  margin: 0 -20px; padding: 14px 20px 12px; background: var(--bg); border-bottom: 2px solid var(--line);
}
.home-bar-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand-small { font-family: var(--font-display); font-size: 19px; color: var(--brand); }
.stat-chips { display: flex; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); font-family: var(--font-display); font-size: 14px; font-variant-numeric: tabular-nums; }
.chip svg { color: var(--brand); }
.xp-line { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.xp-line .progress { height: 12px; }
.hello { display: flex; align-items: center; gap: 14px; padding-top: 4px; }
.hello h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; line-height: 1.3; word-break: keep-all; }
.hello p { margin: 2px 0 0; color: var(--fg-muted); font-size: 15px; }
.notice {
  display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 16px;
  border: 2px dashed var(--accent); background: var(--accent-soft); color: var(--accent);
}
.notice strong { display: block; font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.notice span { font-size: 14px; }
.section-title { margin: 0 0 -6px; font-family: var(--font-display); font-weight: 400; font-size: 15px; color: var(--fg-muted); letter-spacing: .04em; }
.profile-card .summary-row { grid-template-columns: 96px 1fr; padding: 11px 0; }
.chips-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.chips-wrap .chip { background: var(--brand-soft); color: var(--brand); }
.demo-box { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 18px; background: var(--surface-2); }
.demo-box p { margin: 0; font-size: 14px; color: var(--fg-muted); }
.save-state { margin: 0; font-size: 13px; color: var(--fg-muted); text-align: center; }

/* ---------- 토스트 ---------- */
.toast {
  position: absolute; left: 50%; bottom: 104px; z-index: 40; width: max-content; max-width: calc(100% - 40px);
  padding: 12px 18px; border-radius: 14px; background: var(--fg); color: var(--bg); font-size: 15px; text-align: center;
  transform: translate(-50%, 16px); opacity: 0; pointer-events: none; transition: transform .25s var(--ease), opacity .25s;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }


/* =========================================================
 * 2단계: 메인 화면 · 상세 · 기록 · 설정
 * ========================================================= */
.mascot-wrap.xs { width: 44px; }
.tabnum { font-variant-numeric: tabular-nums; }
.center { text-align: center; }
.fine { margin: 0; font-size: 12.5px; color: var(--fg-muted); text-align: center; }
.btn-text { min-height: 44px; border: 0; background: transparent; color: var(--fg-muted); font-family: var(--font-display); font-size: 15px; }
.btn-text.left { align-self: flex-start; padding: 0; }
.btn.xs { width: auto; min-height: 40px; padding: 6px 12px; font-size: 14px; border-radius: 12px; box-shadow: 0 3px 0 var(--line); flex: none; }
.btn.mid { min-height: 50px; font-size: 15.5px; padding: 10px 12px; }
.btn-row { display: grid; gap: 10px; }
.btn-row.n2 { grid-template-columns: 1fr 1fr; }
.btn-row.n3 { grid-template-columns: 1fr 1fr; }
.btn-row.n3 > :last-child { grid-column: 1 / -1; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--fg-muted); font-family: var(--font-display); font-size: 12px; line-height: 1.5; }
.pill.quick { background: var(--gold-soft); color: var(--gold-fg); }
.banner { margin: 0; padding: 12px 14px; border-radius: 14px; font-family: var(--font-display); font-size: 15px; line-height: 1.4; }
.banner.ok { background: var(--success-soft); color: var(--success); }
.banner.accent { background: var(--accent-soft); color: var(--accent); }
.card { display: flex; flex-direction: column; gap: 12px; padding: 16px; background: var(--surface); border: 2px solid var(--line); border-radius: 20px; }
.sec { display: flex; flex-direction: column; gap: 12px; }
.sec-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.sec-title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 20px; line-height: 1.3; }
.sec-title.sm { font-size: 17px; }
.sec-sub { margin: 0; font-size: 13.5px; color: var(--fg-muted); word-break: keep-all; }
.field-label { margin: 0; font-family: var(--font-display); font-size: 15px; }
.field-label .opt { font-family: var(--font-body); font-size: 13px; color: var(--fg-muted); }
.choice-list.compact .choice { min-height: 58px; padding: 10px 14px; }
.tag.sm { min-height: 40px; padding: 0 13px; font-size: 14.5px; }
.chips-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
.chips-wrap .chip { background: var(--brand-soft); color: var(--brand); }

/* 상태바 · 탭바 */
.statusbar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 14px; background: var(--bg); border-bottom: 2px solid var(--line);
}
.stat {
  display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 4px 12px; border-radius: 999px;
  background: var(--surface-2); font-family: var(--font-display); font-size: 17px; font-variant-numeric: tabular-nums;
}
.stat small { font-size: 12px; color: var(--fg-muted); }
.stat .shield { font-size: 14px; margin-left: 2px; }
.ring-wrap { position: relative; display: flex; align-items: center; gap: 8px; }
.ring { transform: rotate(-90deg); flex: none; overflow: visible; }
.ring .track { stroke: var(--track); }
.ring .bar { stroke: var(--brand); transition: stroke-dashoffset 1s var(--ease); }
.ring-text { display: flex; flex-direction: column; font-family: var(--font-display); font-size: 13px; line-height: 1.2; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.ring-text b { font-weight: 400; font-size: 17px; color: var(--fg); }
.ring-text small { font-family: var(--font-body); font-size: 11px; }
.ring-wrap.full .ring .bar { stroke: var(--gold); }
.ring-wrap.full .ring { filter: drop-shadow(0 0 6px var(--gold)); animation: glow 1.8s ease-in-out infinite; }
.spark { position: absolute; color: var(--gold); font-style: normal; font-size: 12px; pointer-events: none; animation: twinkle 1.6s ease-in-out infinite; }
.spark.s1 { left: -4px; top: -4px; }
.spark.s2 { left: 34px; top: -6px; animation-delay: .5s; font-size: 10px; }
.spark.s3 { left: 30px; top: 34px; animation-delay: 1s; }
@keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.4) rotate(0); } 50% { opacity: 1; transform: scale(1.2) rotate(45deg); } }
@keyframes glow { 0%, 100% { filter: drop-shadow(0 0 3px var(--gold)); } 50% { filter: drop-shadow(0 0 9px var(--gold)); } }

.main-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 16px 16px 28px; display: flex; flex-direction: column; gap: 20px; }
.main-scroll:focus { outline: none; }
.tabbar {
  display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg); border-top: 2px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tab {
  min-height: 62px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-family: var(--font-display); font-size: 13px; color: var(--fg-muted);
}
.tab .ti { font-size: 22px; line-height: 1; filter: grayscale(.7); opacity: .75; transition: transform .2s var(--ease), filter .2s, opacity .2s; }
.tab[aria-selected="true"] { color: var(--brand); }
.tab[aria-selected="true"] .ti { filter: none; opacity: 1; transform: translateY(-2px) scale(1.12); }

/* 홈 */
.home-talk .bubble { font-size: 18px; }
.bubble.small { font-size: 16px; font-family: var(--font-body); line-height: 1.5; }
.q-list { display: flex; flex-direction: column; gap: 6px; }
.q-wrap { display: flex; flex-direction: column; }
.qcard {
  --cat: #888; position: relative; display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left;
  padding: 14px; border: 2px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--fg);
  box-shadow: 0 4px 0 var(--line); transition: transform .12s ease, box-shadow .12s ease, opacity .2s;
}
.qcard:hover { border-color: color-mix(in srgb, var(--cat) 45%, var(--line)); }
.qcard:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.cat-icon {
  flex: none; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 23px;
  background: color-mix(in srgb, var(--cat) 16%, var(--surface)); border: 2px solid color-mix(in srgb, var(--cat) 40%, transparent);
}
.cat-icon.sm { width: 38px; height: 38px; border-radius: 12px; font-size: 19px; }
.cat-icon.lg { width: 64px; height: 64px; border-radius: 20px; font-size: 32px; }
.q-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.q-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.q-cat { font-family: var(--font-display); font-size: 13px; color: color-mix(in srgb, var(--cat) 75%, var(--fg)); }
.q-title { font-family: var(--font-display); font-size: 17px; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
.q-title.sm { font-size: 15.5px; }
.q-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; color: var(--fg-muted); font-variant-numeric: tabular-nums; }
.xp { color: var(--brand); font-family: var(--font-display); }
.q-reason { margin: 0; font-size: 12.5px; color: var(--accent); word-break: keep-all; }
.status-pill { margin-left: auto; padding: 2px 9px; border-radius: 999px; font-family: var(--font-display); font-size: 12px; background: var(--surface-2); color: var(--fg-muted); }
.status-pill.doing { background: var(--accent-soft); color: var(--accent); }
.status-pill.done { background: var(--success-soft); color: var(--success); }
.page-head .status-pill { margin-left: 0; }
.qcard.is-done { opacity: .55; box-shadow: none; }
.qcard.is-done .q-title { text-decoration: line-through; text-decoration-thickness: 2px; }
.check-done { position: absolute; right: -6px; top: -8px; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--success); color: var(--bg); font-size: 16px; font-weight: 700; border: 3px solid var(--bg); }
.link-btn { align-self: flex-end; min-height: 40px; padding: 0 6px; border: 0; background: transparent; color: var(--fg-muted); font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; }
.link-btn:hover { color: var(--fg); }

.req-note { margin: 0; font-size: 14px; color: var(--fg-muted); }
.done-group > summary {
  display: flex; justify-content: space-between; align-items: center; min-height: 48px; padding: 10px 16px; border-radius: 14px;
  background: var(--surface-2); color: var(--fg-muted); font-family: var(--font-display); font-size: 15px; cursor: pointer; list-style: none;
}
.done-group > summary::-webkit-details-marker { display: none; }
.done-group > summary::after { content: '▾'; }
.done-group[open] > summary::after { content: '▴'; }
.done-group > .q-list { margin-top: 10px; }

.level-card { gap: 12px; }
.lv-row { display: flex; align-items: center; gap: 14px; }
.lv-badge {
  flex: none; width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; align-content: center;
  background: var(--brand); color: var(--on-brand); font-family: var(--font-display); font-size: 26px; line-height: 1;
  box-shadow: 0 4px 0 var(--brand-deep);
}
.lv-badge small { font-size: 12px; }
.lv-text { flex: 1; min-width: 0; }
.lv-title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 18px; }
.progress.lg { height: 14px; flex: none; }
.next-title { margin: 0; font-size: 13.5px; color: var(--fg-muted); word-break: keep-all; }
.next-title b { font-family: var(--font-display); font-weight: 400; color: var(--brand); }

/* 오버레이 · 시트 */
#overlay-root { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
.overlay { position: absolute; inset: 0; display: flex; flex-direction: column; pointer-events: auto; background: var(--bg); }
.overlay.page { transform: translateX(100%); transition: transform .32s var(--ease); }
.overlay.page.in { transform: none; }
.overlay.full { opacity: 0; transition: opacity .25s ease; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 30%, var(--brand-soft), var(--bg) 65%); overflow-y: auto; }
.overlay.full.in { opacity: 1; }
.overlay.sheet-wrap { background: transparent; justify-content: flex-end; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(25, 14, 6, .45); opacity: 0; transition: opacity .25s; }
.sheet-wrap.in .sheet-backdrop { opacity: 1; }
.sheet {
  position: relative; max-height: 92%; overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 14px;
  padding: 20px 20px calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-radius: 26px 26px 0 0;
  transform: translateY(100%); transition: transform .32s var(--ease);
}
.sheet-wrap.in .sheet { transform: none; }
.sheet-grip { width: 42px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; margin-top: -8px; }
.sheet-x { position: absolute; right: 10px; top: 10px; }
.sheet-title { margin: 0; padding-right: 40px; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.page-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px 10px 8px; border-bottom: 2px solid var(--line); }
.page-head h2 { flex: 1; margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 18px; }
.page-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 16px; }
.page-foot { display: flex; flex-direction: column; gap: 12px; padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px)); border-top: 2px solid var(--line); background: var(--bg); }
.full-inner { position: relative; width: 100%; max-width: 380px; margin: auto; padding: 28px 20px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.full-inner .btn { margin-top: 6px; }

/* 상세 */
.detail-hero { --cat: #888; display: flex; flex-direction: column; gap: 10px; }
.detail-title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 25px; line-height: 1.3; word-break: keep-all; text-wrap: balance; }
.detail-desc { margin: 0; color: var(--fg-muted); font-size: 16px; word-break: keep-all; }
.meta-grid { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.meta-grid > div { padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 2px solid var(--line); }
.meta-grid .wide { grid-column: 1 / -1; }
.meta-grid dt { font-size: 12.5px; color: var(--fg-muted); }
.meta-grid dd { margin: 0; font-family: var(--font-display); font-size: 16px; }
.split:empty { display: none; }
.split { display: flex; flex-direction: column; gap: 10px; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.step {
  display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 10px 14px; border: 2px solid var(--line); border-radius: 14px;
  background: var(--surface); cursor: pointer; transition: background-color .2s, border-color .2s;
}
.step input {
  appearance: none; -webkit-appearance: none; flex: none; width: 26px; height: 26px; margin: 0; border: 2px solid var(--disabled-deep); border-radius: 8px;
  background: var(--surface); display: grid; place-items: center; cursor: pointer;
}
.step input::after { content: ""; width: 7px; height: 12px; border: solid var(--bg); border-width: 0 3px 3px 0; transform: rotate(45deg) translate(-1px, -1px); opacity: 0; }
.step input:checked { background: var(--success); border-color: var(--success); animation: pop .3s var(--ease); }
.step input:checked::after { opacity: 1; }
.step-text { flex: 1; min-width: 0; font-size: 15.5px; word-break: keep-all; }
.step-min { flex: none; font-size: 12.5px; color: var(--fg-muted); }
.step.done { background: var(--success-soft); border-color: transparent; cursor: default; }
.step.done .step-text { color: var(--fg-muted); text-decoration: line-through; }

.msg { display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 16px; background: var(--surface); border: 2px solid var(--line); }
.msg-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--font-display); }
.msg-head b { font-weight: 400; font-size: 16px; }
.msg-text { margin: 0; white-space: pre-wrap; font-size: 15px; line-height: 1.6; user-select: text; }
#op-out { display: flex; flex-direction: column; gap: 10px; }
select.text-input { appearance: auto; }

/* 축하 */
.cel-label { margin: 0; font-family: var(--font-display); font-size: 22px; color: var(--brand); }
.xp-big { margin: 0; font-family: var(--font-display); font-size: 56px; line-height: 1; color: var(--brand); font-variant-numeric: tabular-nums; }
.lv-big { margin: 0; font-family: var(--font-display); font-size: 64px; line-height: 1; color: var(--brand); }
.lv-big small { font-size: 24px; }
.cel-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.cel-row:has(> :nth-child(2):last-child) { grid-template-columns: 1fr 1fr; }
.cel-item { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; padding: 12px 6px; border-radius: 16px; background: var(--surface); border: 2px solid var(--line); }
.cel-item b { font-family: var(--font-display); font-weight: 400; font-size: 17px; font-variant-numeric: tabular-nums; }
.cel-item small { font-size: 12px; color: var(--fg-muted); }
.cel-item .flame, .cel-item .gem { font-size: 34px; line-height: 56px; }
.flame.pop { animation: flame 1s var(--ease) 2; display: inline-block; }
@keyframes flame { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.4) rotate(-8deg); } 70% { transform: scale(.95) rotate(6deg); } }

/* 기록 · 리포트 */
.report-link { flex-direction: row; align-items: center; gap: 14px; text-align: left; color: var(--fg); box-shadow: 0 4px 0 var(--line); }
.report-link:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.report-ico { font-size: 30px; }
.chev { font-size: 28px; color: var(--fg-muted); }
.chart { width: 100%; height: auto; display: block; }
.ch-grid { stroke: var(--line); stroke-width: 2; }
.ch-goal { stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 4 4; }
.ch-goal-t { fill: var(--accent); font-size: 11px; font-family: var(--font-body); }
.ch-bar { fill: color-mix(in srgb, var(--brand) 45%, var(--surface)); }
.ch-bar.hit { fill: var(--brand); }
.ch-bar.today { stroke: var(--brand-deep); stroke-width: 2; }
.ch-val { fill: var(--fg); font-size: 11px; font-family: var(--font-body); }
.ch-day { fill: var(--fg-muted); font-size: 12px; font-family: var(--font-body); }
.ch-day.today { fill: var(--brand); }
.filter-row { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; margin: 0 -2px; scrollbar-width: none; }
.cat-swiper { display: flex; align-items: center; gap: 6px; }
.cs-track { flex: 1; min-width: 0; margin: 0; padding: 4px 4px 8px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
  -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
          mask-image: linear-gradient(90deg, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%); }
.cs-track::-webkit-scrollbar { display: none; }
.cs-track .tag { flex: none; scroll-snap-align: center; white-space: nowrap; }
.cs-track .tag.is-zero { opacity: .55; }
.cs-track .tag[aria-pressed="true"] { opacity: 1; }
.cs-n { font-variant-numeric: tabular-nums; font-size: 12.5px; opacity: .75; }
.cs-arrow { flex: none; width: 32px; height: 32px; margin-bottom: 4px; border-radius: 50%; border: 1px solid var(--line, rgba(0,0,0,.12)); background: var(--surface, #fff);
  color: var(--fg, inherit); font-size: 20px; line-height: 1; display: grid; place-items: center; cursor: pointer; }
.cs-arrow:disabled { opacity: .3; cursor: default; }
.filter-row .tag { flex: none; }
.filter-row .tag[aria-pressed="true"] { transform: none; }
.hist-day { display: flex; flex-direction: column; gap: 8px; }
.hist-date { margin: 6px 0 0; font-family: var(--font-display); font-weight: 400; font-size: 14px; color: var(--fg-muted); }
.hist-item { --cat: #888; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 2px solid var(--line); }
.hist-item .xp { flex: none; }
.hist-note { font-size: 13.5px; color: var(--fg); font-style: italic; word-break: keep-all; }
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px; text-align: center; color: var(--fg-muted); }
.empty p { margin: 0; }
.report-bubble { display: flex; flex-direction: column; gap: 6px; font-size: 17px; }
.report-bubble p { margin: 0; }
.report-bubble .next { font-family: var(--font-body); font-size: 15px; color: var(--accent); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tiles .tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
.tile { display: flex; flex-direction: column; gap: 2px; padding: 14px; border-radius: 18px; background: var(--surface); border: 2px solid var(--line); min-width: 0; }
.tile small { font-size: 13px; color: var(--fg-muted); }
.tile b { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.tile b span { font-size: 15px; margin-left: 2px; }
.tile em { font-style: normal; font-size: 12px; color: var(--fg-muted); word-break: keep-all; }
.up { align-self: flex-start; padding: 1px 8px; border-radius: 999px; background: var(--success-soft); color: var(--success); font-family: var(--font-display); font-size: 13px; }
.catbars { display: flex; flex-direction: column; gap: 10px; }
.catbar { --cat: #888; display: grid; grid-template-columns: 128px 1fr 40px; gap: 10px; align-items: center; font-size: 13.5px; }
.cb-label { min-width: 0; word-break: keep-all; line-height: 1.3; }
.cb-track { height: 12px; border-radius: 999px; background: var(--track); overflow: hidden; }
.cb-fill { display: block; height: 100%; border-radius: inherit; background: var(--cat); }
.cb-val { text-align: right; font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.most-least { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-top: 4px; border-top: 1px solid var(--line); }
.most-least div { display: flex; flex-direction: column; gap: 2px; padding-top: 10px; }
.most-least small { font-size: 12.5px; color: var(--fg-muted); }
.most-least b { font-family: var(--font-display); font-weight: 400; font-size: 15px; word-break: keep-all; }
.quote { margin: 0; gap: 6px; background: var(--brand-soft); border-color: transparent; }
.quote blockquote { margin: 0; font-family: var(--font-display); font-size: 18px; line-height: 1.45; word-break: keep-all; }
.quote figcaption { font-size: 13px; color: var(--fg-muted); }

/* 설정 */
.profile-row { display: flex; align-items: center; gap: 12px; }
.profile-row .mascot-wrap { animation: none; }
.set-row { flex-direction: row; align-items: center; gap: 14px; }
.switch { flex: none; position: relative; width: 56px; height: 34px; border: 0; border-radius: 999px; background: color-mix(in srgb, var(--fg-muted) 50%, var(--surface)); transition: background-color .2s; }
.switch span { position: absolute; left: 4px; top: 4px; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); box-shadow: 0 2px 4px var(--shadow); transition: transform .25s var(--ease); }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"] span { transform: translateX(22px); }

@media (max-width: 380px) {
  .main-scroll { padding-inline: 14px; }
  .ring-text small { display: none; }
  .stat { padding: 4px 10px; }
  .catbar { grid-template-columns: 118px 1fr 36px; font-size: 12.5px; }
  .btn-row.n2 { grid-template-columns: 1fr; }
  .btn-row.n3 { grid-template-columns: 1fr; }
}

/* 배지 */
.medal {
  --cat: #888; position: relative; flex: none; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--cat) 22%, var(--surface)), color-mix(in srgb, var(--cat) 38%, var(--surface)));
  border: 4px solid var(--cat); box-shadow: 0 4px 0 color-mix(in srgb, var(--cat) 60%, #000), inset 0 0 0 3px color-mix(in srgb, var(--surface) 70%, transparent);
}
.medal-emoji { font-size: 30px; line-height: 1; }
.medal.sm { width: 42px; height: 42px; border-width: 3px; box-shadow: 0 3px 0 color-mix(in srgb, var(--cat) 60%, #000); }
.medal.sm .medal-emoji { font-size: 20px; }
.medal.lg { width: 84px; height: 84px; }
.medal.lg .medal-emoji { font-size: 40px; }
.medal.xl { width: 132px; height: 132px; border-width: 6px; animation: medal-in .8s var(--ease) both; }
.medal.xl .medal-emoji { font-size: 64px; }
.medal.locked { filter: grayscale(1); opacity: .5; box-shadow: none; }
.medal-lock { position: absolute; right: -4px; bottom: -4px; font-size: 14px; filter: none; }
@keyframes medal-in { 0% { transform: scale(.3) rotate(-30deg); opacity: 0; } 60% { transform: scale(1.12) rotate(6deg); opacity: 1; } 100% { transform: none; } }
.badge-big-name { margin: 0; font-family: var(--font-display); font-size: 30px; line-height: 1.2; word-break: keep-all; }
.badge-msg { margin: 0; font-size: 16px; color: var(--fg-muted); word-break: keep-all; text-wrap: balance; }
.badge-msg.left { text-align: left; color: var(--fg); }
.badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.badge-tile {
  display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; padding: 14px 6px 12px;
  border: 2px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--fg); text-align: center;
  box-shadow: 0 3px 0 var(--line); transition: transform .12s ease;
}
.badge-tile:active { transform: translateY(3px); box-shadow: none; }
.badge-tile.earned { border-color: color-mix(in srgb, var(--gold) 60%, var(--line)); background: color-mix(in srgb, var(--gold-soft) 55%, var(--surface)); }
.badge-tile.featured { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold), 0 3px 0 var(--line); }
.feat-chip {
  display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; margin-top: 4px; padding: 2px 10px 2px 7px; border-radius: 999px;
  background: var(--gold-soft); color: var(--gold-fg); font-family: var(--font-display); font-size: 13px; line-height: 1.5; word-break: keep-all;
}
.bt-name { font-family: var(--font-display); font-size: 14px; line-height: 1.3; word-break: keep-all; }
.bt-sub { font-size: 12px; color: var(--fg-muted); min-height: 16px; }
.badge-tile.earned .bt-sub { color: var(--gold-fg); font-family: var(--font-display); }
.pips { display: inline-flex; gap: 4px; }
.pips i { width: 9px; height: 9px; border-radius: 50%; background: var(--track); }
.pips i.on { background: var(--brand); }
.badge-hint {
  --cat: #888; display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; text-align: left; color: var(--fg);
  border: 2px dashed color-mix(in srgb, var(--cat) 45%, var(--line)); border-radius: 16px; background: var(--surface);
}
.badge-hint b { font-family: var(--font-display); font-weight: 400; font-size: 15px; }
.badge-sheet-top { display: flex; align-items: center; gap: 16px; }
.badge-stages { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.badge-stages li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--surface-2); }
.badge-stages li b { font-family: var(--font-display); font-weight: 400; font-size: 15px; }
.bs-check { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--track); color: var(--fg-muted); font-family: var(--font-display); }
.badge-stages li.on { background: var(--success-soft); }
.badge-stages li.on .bs-check { background: var(--success); color: var(--bg); }
@media (max-width: 340px) { .badge-grid { grid-template-columns: repeat(2, 1fr); } }

/* 데모 데이터 토글 */
.demo-toggle { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--surface); }
.demo-toggle b { font-family: var(--font-display); font-weight: 400; font-size: 15px; }
.switch.sm { width: 46px; height: 28px; }
.switch.sm span { width: 20px; height: 20px; left: 4px; top: 4px; }
.switch.sm[aria-checked="true"] span { transform: translateX(18px); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  .countdown.run i { animation-duration: var(--dur, 3s) !important; }
}
@media (max-width: 360px) {
  .bubble { font-size: 18px; }
  .mascot-wrap { width: 70px; }
  .choice-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- 온보딩 -->
  <section class="screen" id="screen-onboarding" aria-label="온보딩">
    <header class="ob-header" id="ob-header">
      <button class="icon-btn" id="ob-back" type="button" aria-label="이전 단계로">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="progress" role="progressbar" aria-label="온보딩 진행률" aria-valuemin="0" aria-valuemax="100" id="ob-progress"><div class="progress-fill" id="ob-progress-fill"></div></div>
      <span class="progress-count" id="ob-count" aria-hidden="true"></span>
    </header>
    <div class="ob-viewport" id="ob-viewport"></div>
    <footer class="ob-footer">
      <button class="btn btn-primary" id="ob-cta" type="button">계속하기</button>
    </footer>
  </section>

  <!-- 완료 축하 -->
  <section class="screen celebrate-screen" id="screen-celebrate" aria-label="온보딩 완료" hidden>
    <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
    <div class="mascot-wrap lg" id="celebrate-mascot"></div>
    <h1 class="celebrate-title" id="celebrate-title"></h1>
    <div class="badge-preview">
      <svg class="badge-medal" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="29" fill="#F26B1D"/>
        <circle cx="32" cy="32" r="22" fill="#FFD7B8"/>
        <ellipse cx="26" cy="36" rx="5.5" ry="7.5" fill="#C4500B"/>
        <circle cx="22" cy="26" r="2" fill="#C4500B"/><circle cx="26.5" cy="24.5" r="2" fill="#C4500B"/><circle cx="31" cy="26" r="2" fill="#C4500B"/>
        <ellipse cx="39" cy="31" rx="5" ry="7" fill="#C4500B"/>
        <circle cx="35" cy="21.5" r="1.8" fill="#C4500B"/><circle cx="39.5" cy="20" r="1.8" fill="#C4500B"/><circle cx="44" cy="21.5" r="1.8" fill="#C4500B"/>
      </svg>
      <div>
        <p class="badge-name">첫 발걸음 배지</p>
        <p class="badge-desc">첫 퀘스트를 완료하면 받을 수 있어요</p>
      </div>
    </div>
    <div class="celebrate-actions">
      <button class="btn btn-primary" id="celebrate-go" type="button">홈으로 가기</button>
      <div class="countdown" id="countdown"><i></i></div>
      <p class="countdown-label">잠시 후 홈으로 이동해요</p>
    </div>
  </section>

  <!-- 임시 홈 -->
  <section class="screen" id="screen-main" aria-label="Associate Quest" hidden>
    <header class="statusbar" id="statusbar"></header>
    <main class="main-scroll" id="main-scroll" tabindex="-1"></main>
    <nav class="tabbar" role="tablist" aria-label="메뉴">
      <button class="tab" type="button" role="tab" data-tab="home"><span class="ti" aria-hidden="true">🏠</span>홈</button>
      <button class="tab" type="button" role="tab" data-tab="records"><span class="ti" aria-hidden="true">📊</span>기록</button>
      <button class="tab" type="button" role="tab" data-tab="settings"><span class="ti" aria-hidden="true">⚙️</span>설정</button>
    </nav>
  </section>

  <div id="overlay-root"></div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(() => {
  'use strict';

  /* =========================================================
   * 1. 상수 · 설정 (다음 단계에서 그대로 재사용)
   * ========================================================= */
  const STORAGE_KEY = 'associate-quest/v1';
  const SCHEMA_VERSION = 5;
  const JOIN_RANGE_MONTHS = 24;
  const XP_PER_LEVEL = 100;

  const DIVISIONS = [
    { id: 'audit',      label: '감사',     desc: '회계감사 · 인증 업무',       teamExample: 'CM팀',        icon: 'audit' },
    { id: 'tax',        label: '세무',     desc: '세무조정 · 조세 자문',       teamExample: '국제조세팀',   icon: 'tax' },
    { id: 'deals',      label: '재무자문', desc: 'M&A · 가치평가 · 실사',      teamExample: 'Valuation팀', icon: 'deals' },
    { id: 'consulting', label: '컨설팅',   desc: '전략 · 디지털 · 운영 개선',  teamExample: '디지털전략팀', icon: 'consulting' },
    { id: 'axnode',     label: 'AX Node',  desc: 'AI 전환 · 데이터 · 디지털 혁신', teamExample: 'AX 전략팀',   icon: 'ax' },
    { id: 'other',      label: '기타',     desc: '지원 조직 등 그 밖의 소속', teamExample: '인사팀',       icon: 'other' },
  ];
  // 퀘스트 목록 - 통합질문서.csv 카테고리 10개 + 대인관계 (표시 이름 · 괄호 안 설명)
  const INTEREST_GROUPS = [
    { id: 'work', label: '업무', items: [['커리어', '진로'], ['스터디', '회계산업 이슈·AI·택스 개정'], ['업무 피드백', ''], ['성장', '업무 관련·무관'], ['업무용어', ''], ['대인관계', '클라이언트·상사·동료']] },
    { id: 'life', label: '일상', items: [['맛집', '점심·식사'], ['취미·동호회', '취미활동·사내동호회'], ['체력·스트레스', '체력·스트레스 관리'], ['스몰토크', '네트워킹'], ['조직행사', '조직행사 참여']] },
  ];
  const INTEREST_LABELS = INTEREST_GROUPS.flatMap((g) => g.items.map(([l]) => l));
  const CUSTOM_INTEREST_MAX = 8;
  const CUSTOM_INTEREST_MAXLEN = 12;
  const NETWORKING_STYLES = [
    { id: 'one_on_one', label: '조용한 1:1',     desc: '한 사람과 깊게 이야기하는 게 좋아요' },
    { id: 'group',      label: '여럿이 어울리기', desc: '여러 명과 함께하는 자리가 편해요' },
  ];
  const DAILY_GOALS = [
    { xp: 10, label: '가볍게', desc: '퀘스트 약 1개' },
    { xp: 20, label: '보통',   desc: '퀘스트 약 1~2개', recommended: true },
    { xp: 40, label: '열심히', desc: '퀘스트 약 2~3개' },
  ];
  const DEFAULT_DAILY_GOAL = 20;

  /* =========================================================
   * 2. 유틸
   * ========================================================= */
  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const charLen = (s) => [...s].length;
  const nowISO = () => new Date().toISOString();
  const reducedMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isImeEnter = (e) => e.isComposing || e.keyCode === 229;

  const monthKey = (y, m) => `${y}-${String(m).padStart(2, '0')}`;
  function monthsSince(joinMonth, now = new Date()) {
    const [y, m] = joinMonth.split('-').map(Number);
    return (now.getFullYear() - y) * 12 + (now.getMonth() + 1 - m);
  }
  function recentMonths(now = new Date()) {
    const list = [];
    for (let i = 0; i < JOIN_RANGE_MONTHS; i++) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      list.push(monthKey(d.getFullYear(), d.getMonth() + 1));
    }
    return list;
  }
  const formatJoinMonth = (key) => { if (!key) return '-'; const [y, m] = key.split('-'); return `${y}년 ${Number(m)}월`; };
  const tenureMonth = (key) => monthsSince(key) + 1;
  const divisionOf = (id) => DIVISIONS.find((d) => d.id === id);
  const styleOf = (id) => NETWORKING_STYLES.find((s) => s.id === id);
  const goalOf = (xp) => DAILY_GOALS.find((g) => g.xp === xp);
  const levelInfo = (xp = 0) => ({ level: Math.floor(xp / XP_PER_LEVEL) + 1, into: xp % XP_PER_LEVEL, need: XP_PER_LEVEL });

  let toastTimer;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
  }

  /* =========================================================
   * 3. 아이콘 · 마스코트 · 일러스트 (외부 이미지 없음)
   * ========================================================= */
  const ICON_PATHS = {
    audit: '<path d="M14 3H6v18h6"/><path d="M14 3l4 4v5"/><path d="M14 3v4h4"/><circle cx="16.5" cy="16.5" r="3"/><path d="m19 19 2.5 2.5"/>',
    tax: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
    deals: '<path d="M4 20h16"/><path d="M6 16l4-5 3 3 5-7"/><path d="M14 7h4v4"/>',
    consulting: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>',
    other: '<circle cx="6" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="18" cy="12" r="1.4" fill="currentColor"/>',
    ax: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M10 10h4v4h-4z"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5v.5"/>',
    flame: '<path d="M12 3c1 3 4 4.5 4 9a4 4 0 0 1-8 0c0-2 1-3 2-4 0 1.5.8 2.5 2 2.5-1-2.5-.5-5 0-7.5z"/>',
  };
  const icon = (name, size = 24) =>
    `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name]}</svg>`;

  // 삼일이: 주황색 계산기 캐릭터. 액정 화면에 얼굴, 짧은 팔다리, 위쪽에 태양광 패널.
  function mascotSVG(extraClass = '') {
    const keys = [];
    const xs = [32, 46, 60, 74], ys = [76, 90, 104];
    ys.forEach((y, r) => xs.forEach((x, c) => {
      const isEq = r === 2 && c === 3;
      keys.push(`<rect x="${x}" y="${y}" width="12" height="9" rx="3" fill="${isEq ? '#1E5F74' : '#FFE3CC'}"/>`);
    }));
    return `<svg class="mascot ${extraClass}" viewBox="0 0 120 150" role="img" aria-label="계산기 모양 마스코트 삼일이">
      <g class="m-legs">
        <rect x="40" y="116" width="12" height="20" rx="6" fill="#C4500B"/>
        <rect x="68" y="116" width="12" height="20" rx="6" fill="#C4500B"/>
        <ellipse cx="44" cy="138" rx="10" ry="5" fill="#1E5F74"/>
        <ellipse cx="76" cy="138" rx="10" ry="5" fill="#1E5F74"/>
      </g>
      <g class="m-arm-l">
        <path d="M26 74 Q12 78 10 90" stroke="#C4500B" stroke-width="7" stroke-linecap="round" fill="none"/>
        <circle cx="10" cy="91" r="5.5" fill="#F7893B" stroke="#C4500B" stroke-width="2"/>
      </g>
      <g class="m-arm-r">
        <path d="M94 72 Q108 68 110 54" stroke="#C4500B" stroke-width="7" stroke-linecap="round" fill="none"/>
        <circle cx="110" cy="53" r="5.5" fill="#F7893B" stroke="#C4500B" stroke-width="2"/>
      </g>
      <rect x="22" y="12" width="76" height="110" rx="20" fill="#F7893B" stroke="#C4500B" stroke-width="3"/>
      <path d="M32 18 H70" stroke="#FFB27A" stroke-width="3" stroke-linecap="round"/>
      <rect x="74" y="16" width="16" height="6" rx="2" fill="#8A3A08" opacity=".55"/>
      <rect x="31" y="27" width="58" height="40" rx="9" fill="#FFF6EC" stroke="#C4500B" stroke-width="2.5"/>
      <g class="m-eyes">
        <ellipse cx="50" cy="44" rx="4" ry="5" fill="#2B2118"/>
        <ellipse cx="70" cy="44" rx="4" ry="5" fill="#2B2118"/>
        <circle cx="51.5" cy="42" r="1.4" fill="#FFFFFF"/>

    catsForInterest(label) {

      const hit = KEYWORD_CATS.filter(([re]) => re.test(label)).map(([, c]) => c);

    },
    interestCats(s) {
      const m = {};
      s.profile.interests.forEach((l) => this.catsForInterest(l).forEach((c) => { (m[c] = m[c] || []).push(l); }));

    interestLinks(s) {

      return pool;
    },
    // 하루 1회 3장: ① ② 관심사 미션(②는 5분 이내 우선) ③ 관심사 밖 새로운 미션. 3장 중 1장 이상은 5분 이내
    //   관심사 칸은 최근 3일 완료만 빼고 어제 나온 미션도 다시 허용. 칸에 맞는 미션이 없으면 시간 구분을 풀어서 채움
    pickDaily(s, date, prevIds = []) {
      const ctx = this.ctx(s);
      const rand = rng(`${date}|${s.profile.nickname}`);
      const interest = new Set(Object.keys(this.interestLinks(s)));
      const today = new Set();
      const used = new Set();
      const strict = new Set([...this.recentDone(s, 7), ...prevIds]);
      const loose = this.recentDone(s, 3);
      const base = (q) => !ctx.p.doneBefore.has(q.id) && !today.has(q.id) && !loose.has(q.id);
      const pool = (fn) => narrow(narrow(QUESTS.filter((q) => base(q) && fn(q)), (q) => !strict.has(q.id)), (q) => !used.has(q.cat));
      const first = (...fns) => { for (const fn of fns) { const p = pool(fn); if (p.length) return p; } return QUESTS.filter((q) => !today.has(q.id)); };
      const take = (p) => { const q = weightedPick(p, (x) => this.weightOf(x, ctx), rand); today.add(q.id); used.add(q.cat); return q; };
      const inI = (q) => interest.has(q.cat);
      const a = take(first((q) => inI(q) && !q.quick, (q) => inI(q)));
      const b = take(first((q) => inI(q) && q.quick, (q) => inI(q), (q) => q.quick));
      // ③ 새로운 미션: 앞의 두 장에 5분 이내 미션이 없으면 여기서 채워 '3장 중 1장 이상 빠른 퀘스트'를 지킴
      const needQuick = !a.quick && !b.quick;
      const c = take(needQuick ? first((q) => !inI(q) && q.quick, (q) => q.quick) : first((q) => !inI(q) && !q.quick, (q) => !inI(q), () => true));
      return [a, c, b].map((q) => this.makeItem(s, q, q.quick ? 'quick' : 'main', date));
    },
    makeItem(s, q, slot, date, reason, source = 'rule') {
      return {
        uid: `${date}-${slot}-${q.id}-${hashStr(q.id + Math.random()).toString(36).slice(0, 4)}`,
        questId: q.id, slot, status: 'todo', source,
        reason: reason || this.reasonFor(s, q, slot),
        steps: null, startedAt: null, completedAt: null,
      };
    },
    reasonFor(s, q, slot) {
      const e = this.interestLinks(s)[q.cat];
      const label = e && (e.primaryLabels[0] || e.labels[0]);
      const tag = e && (e.primary ? `관심사 '${label}'` : `'${label}'${josaWa(label)} 이어지는 ${CATEGORIES[q.cat].label}`);
      if (slot === 'quick') return e ? `${tag} · 5분이면 충분해요` : '5분이면 끝나는 빠른 퀘스트예요';
      if (e) return e.primary ? `관심사 '${label}'에 맞춘 퀘스트예요` : `${tag} 퀘스트예요`;
      return '새로운 경험을 넓혀줄 퀘스트예요';
    },
    replacement(s, item, reason) {
      const ctx = this.ctx(s);
      const cur = QMAP[item.questId];
      const exclude = new Set([...s.dailyQuests.items.map((i) => i.questId), ...this.recentDone(s, 7)]);
      let pool = narrow(this.candidates(s, { exclude, ctx }), (q) => q.quick === (item.slot === 'quick'));
      if (reason === 'not_interested') pool = narrow(pool, (q) => q.cat !== cur.cat);
      if (reason === 'no_time') pool = narrow(pool, (q) => q.minutes < cur.minutes || q.minutes <= 10);
      if (reason === 'burden') pool = cur.stage > 1 ? narrow(pool, (q) => q.stage < cur.stage || !q.together) : narrow(pool, (q) => !q.together);
      const rand = rng(`${item.uid}|${reason}|${s.swapHistory.length}`);
      return weightedPick(pool, (x) => this.weightOf(x, ctx), rand);
    },
    // "퀘스트 하나 더 받기": 오늘 퀘스트·최근 3일 완료를 빼고 관심사 카테고리에서 1개
    //   관심사로 먼저 좁힌 뒤에 오늘 없는 카테고리를 우선 (순서가 반대면 관심사가 먼저 다 빠짐)
    pickExtra(s) {
      const ctx = this.ctx(s), dq = s.dailyQuests;
      const inToday = new Set(dq.items.map((i) => i.questId));
      const todayCats = new Set(dq.items.map((i) => QMAP[i.questId].cat));
      const interest = new Set(Object.keys(this.interestLinks(s)));
      let pool = this.candidates(s, { exclude: new Set([...inToday, ...this.recentDone(s, 3)]), ctx }).filter((q) => !inToday.has(q.id));
      pool = narrow(narrow(pool, (q) => interest.has(q.cat)), (q) => !todayCats.has(q.cat));
      if (!pool.length) return null;
      return weightedPick(pool, (x) => this.weightOf(x, ctx), rng(`${dq.date}|extra|${dq.added || 0}|${s.profile.nickname}`));
    },
    // 퀘스트 쪼개기 기본 템플릿 (첫 단계는 항상 2분 이내)
    localSplit(q) {
      const noun = { 1: '동기', 2: '팀 동료', 3: '선배', 4: '타본부 구성원', 5: '클라이언트 담당자' }[q.stage];
      if (q.together && q.minutes <= 5) {
        return [
          { text: `인사를 건넬 ${noun} 한 명 떠올리기`, minutes: 1 },
          { text: '건넬 첫마디 한 문장 정해두기', minutes: 2 },
          { text: q.title, minutes: q.minutes },
        ];
      }
      if (q.together && q.stage === 5) {
        return [
          { text: `오늘 연락할 ${noun} 한 명 정하기`, minutes: 1 },
          { text: '보낼 문장 한 줄 써두기 (첫마디 도우미 활용)', minutes: 3 },
          { text: q.title, minutes: q.minutes },
        ];
      }
      if (q.together) {
        return [
          { text: `사내 메신저에서 말 걸어볼 ${noun} 한 명 찾아보기`, minutes: 2 },
          { text: '인사 메시지 한 줄 써두기 (첫마디 도우미 활용)', minutes: 3 },
          { text: '메시지 보내고 편한 시간 물어보기', minutes: 2 },
          { text: q.title, minutes: q.minutes },
        ];
      }
      return [
        { text: '메모장을 열고 퀘스트 제목만 적어두기', minutes: 1 },
        { text: q.title, minutes: q.minutes },
        { text: '끝나고 느낀 점 한 줄 남기기', minutes: 1 },
      ];
    },
  };
